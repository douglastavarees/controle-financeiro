<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Finance Hub</title>
  <style>
    :root{--bg:#f5f7fb;--c:#fff;--t:#1f2937;--m:#5d6472;--b:#e1e6ef;--p:#2957d6;--g:#15804d;--r:#c63b39;--y:#b57a1c;color-scheme:light}
    *{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,Arial,sans-serif;background:var(--bg);color:var(--t);color-scheme:light}
    nav{display:flex;gap:4px;overflow-x:auto;background:var(--c);border-bottom:1px solid var(--b);padding:8px;position:sticky;top:0;z-index:5}
    nav button{white-space:nowrap;font-size:14px}nav .on{background:var(--p);color:#fff;border-color:var(--p)}
    main{max-width:1100px;margin:0 auto;padding:16px}
    button,input,select,textarea{font:inherit;color:var(--t);background:var(--c);border:1px solid var(--b);border-radius:6px;padding:7px 11px;font-size:15px}
    button{cursor:pointer}button.p{background:var(--p);color:#fff;border-color:var(--p)}button.s{padding:3px 8px;font-size:13px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
    .card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:14px;margin-bottom:14px}
    .k{color:var(--m);font-size:13px}.v{font-size:22px;font-weight:600;margin-top:2px}
    .pos{color:var(--g)}.neg{color:var(--r)}.warn{color:var(--y)}
    table{width:100%;border-collapse:collapse}th,td{padding:7px 9px;border-bottom:1px solid var(--b);text-align:left;font-size:15px}th{color:var(--m);font-weight:600;font-size:13px}
    td.n,th.n{text-align:right;white-space:nowrap}tr.bad td{background:rgba(200,53,47,.08)}.w{overflow-x:auto}
    .bar{height:8px;border-radius:4px;background:var(--p);min-width:1px}.bar.o{background:var(--r)}
    .al{padding:9px 11px;border-left:3px solid var(--y);background:var(--bg);margin:8px 0;border-radius:4px;font-size:15px}.al.e{border-color:var(--r)}
    #modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px;z-index:9}
    #modal .box{background:var(--c);border-radius:12px;padding:16px;width:100%;max-width:560px}
    .f{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f label{display:flex;flex-direction:column;font-size:13px;color:var(--m);gap:3px}.f .full{grid-column:1/-1}
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}h2{margin:4px 0 10px;font-size:19px}
    .lock{position:fixed;inset:0;background:rgba(12,15,20,.82);display:flex;align-items:center;justify-content:center;z-index:30;padding:20px}
    .lock-box{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:24px;max-width:420px;width:100%}
    .hid{display:none!important}
  </style>
</head>
<body>
  <div id="lockScreen" class="lock">
    <div class="lock-box">
      <h2>Finance Hub</h2>
      <p class="k">Digite seu e-mail e senha para acessar o painel.</p>
      <div class="f">
        <label class="full">E-mail
          <input id="loginEmail" type="email" placeholder="seu@email.com">
        </label>
        <label class="full">Senha
          <input id="lockPassword" type="password" placeholder="Digite sua senha">
        </label>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="p" onclick="unlockApp()">Entrar</button>
        <button onclick="setCredentialsPrompt()">Salvar login</button>
      </div>
    </div>
  </div>

  <nav id="nav"></nav>
  <main id="app"></main>
  <div id="modal"></div>

  <script>
    const KEY = 'financehub_v3';
    const EMAIL_KEY = 'financehub_email';
    const PASSWORD_KEY = 'financehub_password';
    const DEFAULT_EMAIL = 'douglas.tavares93@hotmail.com';
    const DEFAULT_PASSWORD = 'Tavares124536@';
    const TABS = ['Painel', 'Lançamentos', 'Parceladas', 'Casa', 'Cartões', 'Projeção', 'Ajustes'];

    const $ = s => document.querySelector(s);
    const uid = () => Math.random().toString(36).slice(2, 9);
    const pad = n => String(n).padStart(2, '0');
    const fmt = (y, m, d) => y + '-' + pad(m) + '-' + pad(d);
    const pd = s => s.split('-').map(Number);
    const T = () => {
      const d = new Date();
      return fmt(d.getFullYear(), d.getMonth() + 1, d.getDate());
    };

    function addM(s, n) {
      const [y, m, d] = pd(s);
      const t = y * 12 + m - 1 + n;
      const yy = Math.floor(t / 12);
      const mm = t % 12;
      const dim = new Date(Date.UTC(yy, mm + 1, 0)).getUTCDate();
      return fmt(yy, mm + 1, Math.min(d, dim));
    }

    function addD(s, n) {
      const [y, m, d] = pd(s);
      const x = new Date(Date.UTC(y, m - 1, d + n));
      return fmt(x.getUTCFullYear(), x.getUTCMonth() + 1, x.getUTCDate());
    }

    const R = c => (c / 100).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    const D = s => s ? s.split('-').reverse().join('/') : '';
    const MN = ['Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho', 'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro'];
    const ML = k => MN[+k.slice(5, 7) - 1] + '/' + k.slice(2, 4);
    const toC = s => {
      s = String(s || '').trim();
      if (!s) return 0;
      if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
      return Math.round(parseFloat(s) * 100) || 0;
    };
    const esc = s => String(s ?? '').replace(/"/g, '&quot;').replace(/</g, '&lt;');
    const mk = o => Object.assign({ id: uid(), kind: 'out', desc: '', amt: 0, date: T(), cat: 'Outros', own: 'Douglas', scope: 'pessoal', pct: 100, card: '', rec: '', end: '', done: {}, skip: {}, ov: {} }, o);
    const def = () => ({ open: { date: T(), bal: 0 }, items: [], cards: [], cats: ['Salário', 'Renda extra', 'Reembolso', 'Fixa', 'Variável', 'Cartão', 'Empréstimo', 'Casa', 'Combustível', 'Alimentação', 'Lazer', 'Saúde', 'Educação', 'Transporte', 'Outros'], lastBackup: '' });

    function normalizeState(raw) {
      const base = def();
      if (!raw || typeof raw !== 'object') return base;
      const next = { ...base, ...raw };
      next.open = { ...base.open, ...(raw.open || {}) };
      next.items = Array.isArray(raw.items) ? raw.items.map(x => mk(x)) : [];
      next.cards = Array.isArray(raw.cards) ? raw.cards : [];
      next.cats = Array.isArray(raw.cats) && raw.cats.length ? raw.cats : base.cats;
      next.lastBackup = raw.lastBackup || '';
      return next;
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(KEY);
        return normalizeState(raw ? JSON.parse(raw) : null);
      } catch (e) {
        return def();
      }
    }

    let S = loadState();
    let tab = 0, F = { m: '', cat: '', own: '', st: '', q: '' }, CM = T().slice(0, 7), HZ = 12, PM = null;

    function save() {
      try {
        localStorage.setItem(KEY, JSON.stringify(S));
      } catch (e) {
        alert('Não foi possível salvar: ' + e.message + '. Exporte um backup.');
      }
      render();
    }

    function unlockApp() {
      const enteredEmail = $('#loginEmail').value.trim().toLowerCase();
      const actualEmail = (localStorage.getItem(EMAIL_KEY) || DEFAULT_EMAIL).trim().toLowerCase();
      const enteredPassword = $('#lockPassword').value.trim();
      const actualPassword = localStorage.getItem(PASSWORD_KEY) || DEFAULT_PASSWORD;

      if (enteredEmail !== actualEmail) {
        alert('E-mail incorreto.');
        $('#loginEmail').value = '';
        $('#lockPassword').value = '';
        return;
      }

      if (enteredPassword !== actualPassword) {
        alert('Senha incorreta.');
        $('#lockPassword').value = '';
        return;
      }

      $('#lockScreen').classList.add('hid');
      $('#loginEmail').value = '';
      $('#lockPassword').value = '';
      render();
    }

    function setCredentialsPrompt() {
      const currentEmail = localStorage.getItem(EMAIL_KEY) || DEFAULT_EMAIL;
      const currentPassword = localStorage.getItem(PASSWORD_KEY) || DEFAULT_PASSWORD;
      const email = prompt('Digite o e-mail de acesso:', currentEmail);
      if (email === null) return;
      const safeEmail = email.trim();
      if (!safeEmail || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(safeEmail)) {
        alert('Informe um e-mail válido.');
        return;
      }
      const desired = prompt('Digite a nova senha do painel:', currentPassword);
      if (desired === null) return;
      const safePassword = desired.trim();
      if (!safePassword) {
        alert('A senha não pode ficar vazia.');
        return;
      }
      localStorage.setItem(EMAIL_KEY, safeEmail.toLowerCase());
      localStorage.setItem(PASSWORD_KEY, safePassword);
      alert('Login e senha salvos com sucesso.');
      $('#loginEmail').value = '';
      $('#lockPassword').value = '';
    }

    /* motor financeiro */
    function occ(it, upto) {
      const o = [];
      for (let k = 0; ; k++) {
        let dt;
        if (it.rec === 'mensal') dt = addM(it.date, k);
        else if (it.rec === 'anual') dt = addM(it.date, 12 * k);
        else if (it.rec === 'semanal') dt = addD(it.date, 7 * k);
        else if (it.rec === 'quinzenal') dt = addD(it.date, 14 * k);
        else if (k > 0) break;
        else dt = it.date;

        if (dt > upto || (it.end && dt > it.end)) break;
        if (it.skip[dt]) continue;
        o.push({ it, dt, amt: it.ov[dt] != null ? it.ov[dt] : it.amt, done: !!it.done[dt] });
      }
      return o;
    }

    const eff = o => {
      const i = o.it;
      if (i.kind === 'transfer') return 0;
      const a = i.scope === 'casa' ? Math.round(o.amt * i.pct / 100) : o.amt;
      return i.kind === 'in' ? a : -a;
    };
    const cmp = (a, b) => a.dt < b.dt ? -1 : a.dt > b.dt ? 1 : 0;
    const events = up => S.items.flatMap(i => occ(i, up)).filter(o => o.dt >= S.open.date).sort(cmp);
    const MS = () => T().slice(0, 7) + '-01';

    function proj(n) {
      const ms = MS();
      const ev = events(addD(addM(ms, n), -1));
      let bal = S.open.bal + ev.filter(o => o.dt < ms).reduce((s, o) => s + eff(o), 0);
      const rows = [];
      for (let i = 0; i < n; i++) {
        const k = addM(ms, i).slice(0, 7);
        const m = ev.filter(o => o.dt.slice(0, 7) === k);
        const inn = m.reduce((s, o) => s + Math.max(eff(o), 0), 0);
        const out = m.reduce((s, o) => s + Math.max(-eff(o), 0), 0);
        rows.push({ k, ini: bal, inn, out, fim: bal + inn - out, ev: m });
        bal += inn - out;
      }
      return rows;
    }

    const atual = () => S.open.bal + events(T()).filter(o => o.done).reduce((s, o) => s + eff(o), 0);
    const st = o => o.done ? (o.it.kind === 'in' ? 'Recebido' : 'Pago') : o.dt < T() ? 'Atrasado' : 'Previsto';
    const cl = v => v < 0 ? 'neg' : 'pos';

    function go(i) { tab = i; render(); }

    function render() {
      if (!localStorage.getItem(EMAIL_KEY) || !localStorage.getItem(PASSWORD_KEY)) {
        localStorage.setItem(EMAIL_KEY, DEFAULT_EMAIL);
        localStorage.setItem(PASSWORD_KEY, DEFAULT_PASSWORD);
      }

      $('#nav').innerHTML = TABS.map((t, i) => `<button class="${i == tab ? 'on' : ''}" onclick="go(${i})">${t}</button>`).join('');
      $('#app').innerHTML = [vPainel, vLanc, vParc, vCasa, vCart, vProj, vAj][tab]();
    }

    function vPainel() {
      const rows = proj(13), c = rows[0], T0 = T();
      const fx = c.ev.filter(o => eff(o) < 0 && o.it.rec).reduce((s, o) => s - eff(o), 0);
      const pa = c.ev.filter(o => eff(o) < 0 && o.it.grp).reduce((s, o) => s - eff(o), 0);
      const va = c.out - fx - pa;
      const fut = events(addM(MS(), 24)).filter(o => o.it.grp && o.dt > T0 && eff(o) < 0).reduce((s, o) => s - eff(o), 0);
      const cart = c.ev.filter(o => eff(o) < 0 && (o.it.card || o.it.cat === 'Cartão' || o.it.cat === 'Empréstimo')).reduce((s, o) => s - eff(o), 0);

      const kp = (k, v, x = '') => `<div class="card" style="margin:0"><div class="k">${k}</div><div class="v ${x}">${v}</div></div>`;
      let h = `<div class="grid">${kp('Saldo atual (baixas)', R(atual()), cl(atual()))}${kp('Entradas do mês', R(c.inn))}${kp('Saídas do mês', R(c.out))}${kp('Saldo previsto fim do mês', R(c.fim))}</div>`;
      h += '<div class="card"><h2>Alertas</h2>' + alerts(rows) + '</div>';
      const mx = Math.max(1, ...rows.slice(0, 6).flatMap(r => [r.inn, r.out]));
      h += '<div class="card"><h2>Entradas e saídas (6 meses)</h2>' + rows.slice(0, 6).map(r => `<div style="margin-bottom:8px"><div class="k">${ML(r.k)}: <span class="pos">${R(r.inn)}</span> / <span class="neg">${R(r.out)}</span></div><div class="bar" style="width:${r.inn * 100 / mx}%"></div><div class="bar o" style="width:${r.out * 100 / mx}%"></div></div>`).join('') + '</div>';

      const cats = {};
      c.ev.filter(o => eff(o) < 0).forEach(o => cats[o.it.cat] = (cats[o.it.cat] || 0) - eff(o));
      const ce = Object.entries(cats).sort((a, b) => b[1] - a[1]);
      h += '<div class="card"><h2>Gastos por categoria no mês</h2>' + (ce.length ? ce.map(([k, v]) => `<div class="k">${esc(k)}: ${R(v)}</div><div class="bar" style="width:${v * 100 / ce[0][1]}%"></div>`).join('') : '<span class="k">Nenhuma despesa.</span>') + '</div>';
      return h;
    }

    function alerts(rows) {
      const a = [], T0 = T(), ev = events(addD(T0, 3));
      rows.forEach(r => {
        if (r.fim < 0) a.push(['e', `Saldo negativo previsto em ${ML(r.k)}: ${R(r.fim)}`]);
        else if (r.out > r.inn && r.out) a.push(['', `${ML(r.k)}: despesas (${R(r.out)}) superam as receitas (${R(r.inn)})`]);
        const pa = r.ev.filter(o => o.it.grp && eff(o) < 0).reduce((s, o) => s - eff(o), 0);
        if (r.out && pa > r.out * .4) a.push(['', `${ML(r.k)}: parcelas concentram ${Math.round(pa * 100 / r.out)}% das saídas`]);
        if (r.inn && r.out > r.inn * .8 && r.out <= r.inn) a.push(['', `${ML(r.k)}: ${Math.round(r.out * 100 / r.inn)}% da renda comprometida`]);
      });
      const late = events(addD(T0, -1)).filter(o => !o.done && eff(o) !== 0);
      if (late.length) a.push(['e', `${late.length} lançamento(s) atrasado(s) sem baixa, total ${R(late.reduce((s, o) => s + eff(o), 0))}`]);
      const soon = ev.filter(o => !o.done && o.dt >= T0 && eff(o) < 0);
      if (soon.length) a.push(['', `${soon.length} conta(s) vencem em até 3 dias: ${R(-soon.reduce((s, o) => s + eff(o), 0))}`]);
      if (!S.lastBackup || T0 > addD(S.lastBackup, 30)) a.push(['', 'Faça um backup (Ajustes > Exportar backup): os dados ficam apenas neste navegador.']);
      return a.length ? a.map(x => `<div class="al ${x[0]}">${x[1]}</div>`).join('') : '<span class="k">Nenhum alerta.</span>';
    }

    const opt = (l, v) => l.map(x => `<option ${x === v ? 'selected' : ''}>${esc(x)}</option>`).join('');

    function vLanc() {
      let ev = S.items.flatMap(i => occ(i, addM(MS(), 24))).filter(o => (!F.m || o.dt.slice(0, 7) === F.m) && (!F.cat || o.it.cat === F.cat) && (!F.own || o.it.own === F.own) && (!F.st || st(o) === F.st) && (!F.q || `${o.it.desc} ${o.it.cat} ${o.it.own}`.toLowerCase().includes(F.q.toLowerCase()))).sort(cmp);
      const n = ev.length; ev = ev.slice(0, 400);
      return `<h2>Lançamentos e entradas</h2><div class="row"><button class="p" onclick="openForm()">Novo lançamento</button><button onclick="openForm(null,null,'in')">Nova entrada</button><input type="month" value="${F.m}" onchange="F.m=this.value;render()"><select onchange="F.cat=this.value;render()"><option value="">Categoria</option>${opt(S.cats, F.cat)}</select><select onchange="F.own=this.value;render()"><option value="">Responsável</option>${opt(['Douglas', 'Bianca', 'Compartilhado', 'Outro'], F.own)}</select><select onchange="F.st=this.value;render()"><option value="">Situação</option>${opt(['Previsto', 'Pago', 'Recebido', 'Atrasado'], F.st)}</select><input placeholder="Buscar" value="${esc(F.q)}" oninput="F.q=this.value;render()"></div>${n > ev.length ? `<div class="k">Mostrando 400 de ${n} lançamentos.</div>` : ''}<div class="card w"><table><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Resp.</th><th>Meio</th><th class="n">Valor</th><th>Situação</th><th></th></tr>${ev.map(o => { const i = o.it; const val = eff(o); return `<tr ${o.done ? '' : ''}><td>${D(o.dt)}</td><td>${esc(i.desc)}</td><td>${esc(i.cat)}</td><td>${esc(i.own)}</td><td>${esc(i.card || '—')}</td><td class="n ${val < 0 ? 'neg' : 'pos'}">${R(val)}</td><td>${st(o)}</td><td><button class="s" onclick="openForm('${i.id}','${o.dt}')">Editar</button> <button class="s" onclick="rm('${i.id}','${o.dt}')">Excluir</button></td></tr>`; }).join('') || '<tr><td colspan="8"><span class="k">Nenhum lançamento.</span></td></tr>'}</table></div>`;
    }

    function vProj() {
      const rows = proj(HZ);
      return `<h2>Projeção de saldo</h2><div class="row"><span class="k">Horizonte:</span><select onchange="HZ=+this.value;PM=null;render()">${[6, 12, 24, 36].map(n => `<option value="${n}" ${n === HZ ? 'selected' : ''}>${n} meses</option>`).join('')}</select></div><div class="card w"><table><tr><th>Mês</th><th class="n">Saldo inicial</th><th class="n">Entradas previstas</th><th class="n">Saídas previstas</th><th class="n">Saldo final</th></tr>${rows.map(r => `<tr><td>${ML(r.k)}</td><td class="n">${R(r.ini)}</td><td class="n pos">${R(r.inn)}</td><td class="n neg">${R(r.out)}</td><td class="n ${r.fim < 0 ? 'neg' : 'pos'}">${R(r.fim)}</td></tr>`).join('')}</table></div>`;
    }

    function groups() {
      const g = {};
      S.items.filter(i => i.grp).forEach(i => (g[i.grp] = g[i.grp] || []).push(i));
      return Object.entries(g);
    }

    function vParc() {
      const gs = groups();
      return `<h2>Compras parceladas</h2><div class="row"><button class="p" onclick="openParc()">Nova compra parcelada</button></div><div class="card w"><table><tr><th>Compra</th><th>Parcelas</th><th>Total</th><th>Restante</th><th>Ações</th></tr>${gs.length ? gs.map(([id, l]) => { const paid = l.filter(i => i.done[i.date]).length; const rem = l.filter(i => !i.done[i.date]).reduce((s, i) => s + i.amt, 0); const total = l.reduce((s, i) => s + i.amt, 0); return `<tr><td>${esc(l[0].desc.replace(/ \(.*$/, ''))}</td><td>${paid}/${l.length}</td><td>${R(total)}</td><td>${R(rem)}</td><td><button class="s" onclick="gQuit('${id}')">Quitar</button> <button class="s" onclick="gAlt('${id}')">Ajustar</button> <button class="s" onclick="gDel('${id}')">Excluir</button></td></tr>`; }).join('') : '<tr><td colspan="5"><span class="k">Nenhuma compra parcelada.</span></td></tr>'}</table></div>`;
    }

    function vCasa() {
      const ev = events(addD(addM(CM + '-01', 1), -1)).filter(o => o.it.scope === 'casa' && o.dt.slice(0, 7) === CM); let a = 0, d = 0, b = 0;
      ev.forEach(o => { if (eff(o) < 0) d += -eff(o); else a += eff(o); b += eff(o); });
      return `<h2>Despesas residenciais</h2><div class="row"><input type="month" value="${CM}" onchange="CM=this.value;render()"><button class="p" onclick="openForm(null,null,'out','casa')">Nova despesa</button></div><div class="grid"><div class="card" style="margin:0"><div class="k">Entradas</div><div class="v pos">${R(a)}</div></div><div class="card" style="margin:0"><div class="k">Saídas</div><div class="v neg">${R(d)}</div></div><div class="card" style="margin:0"><div class="k">Saldo</div><div class="v ${b < 0 ? 'neg' : 'pos'}">${R(b)}</div></div></div><div class="card w"><table><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th class="n">Valor</th></tr>${ev.map(o => `<tr><td>${D(o.dt)}</td><td>${esc(o.it.desc)}</td><td>${esc(o.it.cat)}</td><td class="n ${eff(o) < 0 ? 'neg' : 'pos'}">${R(eff(o))}</td></tr>`).join('') || '<tr><td colspan="4"><span class="k">Nenhuma despesa no período.</span></td></tr>'}</table></div>`;
    }

    function vCart() {
      const ev = events(addM(MS(), 12));
      return `<h2>Cartões</h2><div class="row"><button class="p" onclick="openCard()">Novo cartão</button></div>${S.cards.map(c => { const mine = ev.filter(o => o.it.card === c.name && eff(o) < 0).reduce((s, o) => s - eff(o), 0); return `<div class="card"><div class="row"><b>${esc(c.name)}</b><span class="k">Limite: ${R(c.limit)}</span></div><div class="k">Uso atual: ${R(mine)}</div></div>`; }).join('') || '<div class="card"><span class="k">Nenhum cartão cadastrado.</span></div>'}`;
    }

    function vAj() {
      return `<h2>Ajustes</h2><div class="card"><b>Login de acesso</b><div class="row" style="margin-top:8px"><input id="emailNew" type="email" value="${esc(localStorage.getItem(EMAIL_KEY) || DEFAULT_EMAIL)}" placeholder="seu@email.com"><input id="pwNew" type="password" placeholder="Nova senha"><button class="p" onclick="setPasswordFromUI()">Salvar</button></div></div><div class="card"><b>Saldo inicial</b><div class="row" style="margin-top:8px"><input type="date" id="od" value="${S.open.date}"><input id="ob" value="${(S.open.bal / 100).toFixed(2).replace('.', ',')}"><button class="p" onclick="saveOpen()">Salvar</button></div></div><div class="card"><b>Dados</b><div class="row" style="margin-top:8px"><button onclick="expJ()">Exportar backup (JSON)</button><label class="s" style="border:1px solid var(--b);border-radius:6px;padding:7px 11px;display:inline-block"><input type="file" accept=".json" onchange="impJ(this.files[0])" style="display:none">Importar backup</label></div></div>`;
    }

    function setPasswordFromUI() {
      const email = $('#emailNew').value.trim().toLowerCase();
      const pw = $('#pwNew').value.trim();
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        alert('Digite um e-mail válido.');
        return;
      }
      if (!pw) {
        alert('Digite uma senha válida.');
        return;
      }
      localStorage.setItem(EMAIL_KEY, email);
      localStorage.setItem(PASSWORD_KEY, pw);
      $('#pwNew').value = '';
      alert('Login e senha atualizados com sucesso.');
    }

    function saveOpen() {
      const d = $('#od').value;
      const b = toC($('#ob').value);
      if (!d) return alert('Informe a data.');
      S.open.date = d;
      S.open.bal = b;
      save();
    }

    function modal(h) {
      $('#modal').innerHTML = `<div class="box">${h}</div>`;
      $('#modal').style.display = 'flex';
    }

    function closeM() { $('#modal').style.display = 'none'; }

    const L = (id, l, inner, full) => `<label class="${full ? 'full' : ''}">${l}${inner}</label>`;
    const I = (id, v, t = 'text', x = '') => `<input id="${id}" type="${t}" value="${esc(v)}" ${x}>`;
    const SE = (id, l, v) => `<select id="${id}">${opt(l, v)}</select>`;

    function openForm(id, dt, kind, scope) {
      const it = id ? S.items.find(i => i.id === id) : mk({ kind: kind || 'out', scope: scope || 'pessoal', pct: scope === 'casa' ? 50 : 100, own: scope === 'casa' ? 'Compartilhado' : 'Douglas' });
      if (!it) return;
      const amt = it.ov && dt && it.ov[dt] != null ? it.ov[dt] : it.amt;
      const d = dt || it.date;
      const cs = ['(conta/dinheiro)', ...S.cards.map(c => c.name)];
      modal(`<h2>${id ? 'Editar' : 'Novo'} lançamento</h2><div class="f">${L('','Descrição',I('fd', it.desc),1)}${L('','Valor (R$)', I('fa', (amt / 100).toFixed(2).replace('.', ','), 'text'))}${L('','Data', I('fdt', d, 'date'))}${L('','Categoria', SE('fc', S.cats, it.cat))}${L('','Responsável', SE('fo', ['Douglas', 'Bianca', 'Compartilhado', 'Outro'], it.own))}${L('','Tipo', SE('fk', ['out', 'in', 'transfer'], it.kind))}${L('','Escopo', SE('fs', ['pessoal', 'casa'], it.scope))}${L('','Meio de pagamento', SE('fm', cs, it.card || '(conta/dinheiro)'))}${L('','Recorrência', SE('fr', ['', 'mensal', 'anual', 'semanal', 'quinzenal'], it.rec))}${L('','Fim da recorrência', I('fe', it.end || '', 'date'))}${L('','Percentual da casa', I('fp', it.pct || 100, 'number', 'min="0" max="100"'))}<div class="row full"><label><input id="fx" type="checkbox" ${it.done[d] ? 'checked' : ''}> Já pago</label><button class="p" onclick="sv('${id || ''}','${d}')">Salvar</button><button onclick="closeM()">Cancelar</button></div></div>`);
    }

    function sv(id, dt) {
      const g = x => $('#' + x).value, amt = toC(g('fa')), desc = g('fd').trim(), date = g('fdt');
      if (!desc || amt <= 0 || !date) return alert('Informe descrição, valor maior que zero e data.');

      let pct = Math.min(100, Math.max(0, +g('fp') || 0));
      if (g('fs') === 'pessoal') pct = 100;

      const o = { kind: g('fk'), desc, amt, date, cat: g('fc'), own: g('fo'), card: g('fm').startsWith('(') ? '' : g('fm'), scope: g('fs'), pct, rec: g('fr'), end: g('fe') };
      const dn = $('#fx').checked;

      if (!id) {
        const n = mk(o);
        if (dn) n.done[date] = true;
        S.items.push(n);
      } else {
        const it = S.items.find(i => i.id === id);
        let c = '3';
        if (it.rec) {
          c = prompt('Lançamento recorrente. Aplicar a: 1 = só esta ocorrência, 2 = esta e as futuras, 3 = todas', '2');
          if (!c) return;
        }

        if (c === '1') {
          it.skip[dt] = true;
          const n = mk({ ...o, rec: '', end: '' });
          if (dn) n.done[date] = true;
          S.items.push(n);
        } else if (c === '2' && dt !== it.date) {
          it.end = addD(dt, -1);
          const n = mk(o);
          ['done', 'skip', 'ov'].forEach(k => {
            Object.keys(it[k]).filter(x => x >= dt).forEach(x => { n[k][x] = it[k][x]; delete it[k][x]; });
          });
          if (dn) n.done[date] = true;
          S.items.push(n);
        } else {
          const od = it.done[dt];
          Object.assign(it, o);
          if (!it.rec) {
            it.done = {};
            if (dn) it.done[date] = true;
            it.ov = {};
          } else if (dn !== !!od) {
            it.done[dt] = dn;
          }
        }
      }

      closeM();
      save();
    }

    function openParc() {
      modal(`<h2>Nova compra parcelada</h2><div class="f">${L('','Descrição',I('pd',''),1)}${L('','Valor total (R$)',I('pt',''))}${L('','Entrada (R$)',I('pe','0,00'))}${L('','Nº de parcelas',I('pn','1','number','min="1"'))}${L('','Data da 1ª parcela',I('p1', T(), 'date'))}${L('','Categoria',SE('pc', S.cats, 'Cartão'))}${L('','Responsável',SE('po', ['Douglas', 'Bianca', 'Compartilhado', 'Outro'], 'Douglas'))}${L('','Meio de pagamento',SE('pm', ['(conta/dinheiro)', ...S.cards.map(c => c.name)], '(conta/dinheiro)'))}<div class="row full"><button class="p" onclick="svParc()">Salvar</button><button onclick="closeM()">Cancelar</button></div></div>`);
    }

    function svParc() {
      const g = x => $('#' + x).value, desc = g('pd').trim(), n = Math.max(1, +g('pn') || 1), ent = toC(g('pe')), tot = toC(g('pt')), d1 = g('p1');
      if (!desc || tot <= 0 || !d1) return alert('Informe descrição, valor total e data.');
      const rest = tot - ent, grp = uid(), b = { cat: g('pc'), own: g('po'), card: g('pm').startsWith('(') ? '' : g('pm'), grp, n };
      if (ent > 0) S.items.push(mk({ ...b, desc: desc + ' (entrada)', amt: ent, date: d1, kind: 'out' }));
      for (let k = 1; k <= n; k++) {
        const a = Math.round(rest / n);
        S.items.push(mk({ ...b, desc: `${desc} (parcela)`, amt: a, date: addM(d1, k - 1), kind: 'out', k }));
      }
      closeM();
      save();
    }

    function openCard() {
      modal(`<h2>Novo cartão</h2><div class="f">${L('','Nome',I('cn',''),1)}${L('','Limite (R$)',I('cl',''))}${L('','Dia de fechamento',I('cf','1','number','min="1" max="31"'))}${L('','Dia de vencimento',I('cv','1','number','min="1" max="31"'))}<div class="row full"><button class="p" onclick="svCard()">Salvar</button><button onclick="closeM()">Cancelar</button></div></div>`);
    }

    function svCard() {
      const n = $('#cn').value.trim();
      if (!n) return alert('Informe o nome.');
      S.cards.push({ id: uid(), name: n, limit: toC($('#cl').value), close: +$('#cf').value, due: +$('#cv').value });
      closeM();
      save();
    }

    function delCard(id) {
      if (confirm('Remover cartão?')) {
        S.cards = S.cards.filter(c => c.id !== id);
        save();
      }
    }

    function tg(id, dt) {
      const i = S.items.find(x => x.id === id);
      i.done[dt] = !i.done[dt];
      if (!i.done[dt]) delete i.done[dt];
      save();
    }

    function du(id, dt) {
      const i = S.items.find(x => x.id === id);
      S.items.push(mk({ ...i, id: uid(), rec: '', end: '', date: dt, amt: i.ov[dt] ?? i.amt, grp: undefined, k: undefined, n: undefined, done: {}, skip: {}, ov: {} }));
      save();
    }

    function rm(id, dt) {
      const i = S.items.find(x => x.id === id);
      let c = '3';
      if (i.rec) {
        c = prompt('Excluir: 1 = só esta ocorrência, 2 = esta e as futuras, 3 = todas', '1');
        if (!c) return;
      } else if (!confirm('Excluir este lançamento?')) return;

      if (c === '1' && i.rec) i.skip[dt] = true;
      else if (c === '2' && dt !== i.date) i.end = addD(dt, -1);
      else S.items = S.items.filter(x => x.id !== id);
      save();
    }

    const gi = id => S.items.filter(i => i.grp === id);

    function gAlt(id) {
      const v = prompt('Novo valor (R$) das parcelas futuras ainda não pagas:');
      if (v === null) return;
      const a = toC(v);
      if (a <= 0) return;
      gi(id).filter(i => i.k > 0 && !i.done[i.date] && i.date >= T()).forEach(i => i.amt = a);
      save();
    }

    function gQuit(id) {
      const l = gi(id).filter(i => i.k > 0 && !i.done[i.date]), s = l.reduce((a, i) => a + i.amt, 0);
      if (!l.length || !confirm(`Quitar saldo restante de ${R(s)} hoje?`)) return;
      const b = l[0];
      S.items = S.items.filter(i => !l.includes(i));
      const n = mk({ desc: b.desc.replace(' (parcela)', ' (quitação)'), amt: s, date: T(), cat: b.cat, own: b.own, card: b.card });
      n.done[T()] = true;
      S.items.push(n);
      save();
    }

    function gCanc(id) {
      if (confirm('Cancelar as parcelas ainda não pagas? As já pagas permanecem no histórico.')) {
        S.items = S.items.filter(i => !(i.grp === id && i.k > 0 && !i.done[i.date]));
        save();
      }
    }

    function gDel(id) {
      if (confirm('Excluir a compra e todas as parcelas, inclusive as pagas?')) {
        S.items = S.items.filter(i => i.grp !== id);
        save();
      }
    }

    function dl(name, txt, type) {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([txt], { type }));
      a.download = name;
      a.click();
    }

    function expJ() {
      S.lastBackup = T();
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
      dl('financehub-backup-' + T() + '.json', JSON.stringify(S, null, 1), 'application/json');
      render();
    }

    function impJ(f) {
      if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const d = JSON.parse(r.result);
          if (!d.items || !d.open) throw 0;
          if (confirm('Substituir os dados atuais pelo backup?')) {
            S = normalizeState(d);
            save();
          }
        } catch (e) {
          alert('Arquivo de backup inválido.');
        }
      };
      r.readAsText(f);
    }

    function expC() {
      const ev = S.items.flatMap(i => occ(i, addM(MS(), 24))).sort(cmp);
      const q = x => '"' + String(x).replace(/"/g, '""') + '"';
      dl('lancamentos-' + T() + '.csv', '\ufeffData;Descrição;Tipo;Categoria;Responsável;Meio;Valor total;Valor Douglas;Situação\n' + ev.map(o => [D(o.dt), q(o.it.desc), o.it.kind, q(o.it.cat), q(o.it.own), q(o.it.card || ''), q(R(eff(o))), q(R(eff(o))), q(st(o))].join(';')).join('\n'), 'text/csv');
    }

    function seed() {
      if (!confirm('Adicionar à base os lançamentos futuros da planilha (Nov/2026 a Jan/2027)? O saldo inicial não é alterado.')) return;
      const P = (desc, amt, date, cat, x = {}) => S.items.push(mk({ desc, amt, date, cat, ...x }));
      P('Salário líquido', 449849, '2026-11-05', 'Salário', { kind: 'in', rec: 'mensal' });
      save();
    }

    function init() {
      if (!localStorage.getItem(EMAIL_KEY)) localStorage.setItem(EMAIL_KEY, DEFAULT_EMAIL);
      if (!localStorage.getItem(PASSWORD_KEY)) localStorage.setItem(PASSWORD_KEY, DEFAULT_PASSWORD);
      if (!localStorage.getItem(KEY)) {
        localStorage.setItem(KEY, JSON.stringify(S));
      }
      render();
    }

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
