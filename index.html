<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finance Hub</title>
<style>
:root{--bg:#f5f6f8;--c:#fff;--t:#1d2433;--m:#6b7385;--b:#e2e5ec;--p:#1f4fd8;--g:#12805c;--r:#c8352f;--y:#b7791f}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--c:#1b202b;--t:#e8ebf2;--m:#98a0b3;--b:#2b3242;--p:#6b93ff;--g:#3ccf9a;--r:#ff7b73;--y:#e7b04a}}
*{box-sizing:border-box}body{margin:0;font:14px system-ui,Arial,sans-serif;background:var(--bg);color:var(--t)}
nav{display:flex;gap:4px;overflow-x:auto;background:var(--c);border-bottom:1px solid var(--b);padding:8px;position:sticky;top:0;z-index:5}
nav button{white-space:nowrap}nav .on{background:var(--p);color:#fff;border-color:var(--p)}
main{max-width:1100px;margin:0 auto;padding:14px}
button,input,select,textarea{font:inherit;color:var(--t);background:var(--c);border:1px solid var(--b);border-radius:6px;padding:6px 10px}
button{cursor:pointer}button.p{background:var(--p);color:#fff;border-color:var(--p)}button.s{padding:2px 7px;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:12px;margin-bottom:12px}
.k{color:var(--m);font-size:12px}.v{font-size:20px;font-weight:600;margin-top:2px}
.pos{color:var(--g)}.neg{color:var(--r)}.warn{color:var(--y)}
table{width:100%;border-collapse:collapse}th,td{padding:6px 8px;border-bottom:1px solid var(--b);text-align:left}th{color:var(--m);font-weight:500;font-size:12px}
td.n,th.n{text-align:right;white-space:nowrap}tr.bad td{background:rgba(200,53,47,.08)}.w{overflow-x:auto}
.bar{height:8px;border-radius:4px;background:var(--p);min-width:1px}.bar.o{background:var(--r)}
.al{padding:8px 10px;border-left:3px solid var(--y);background:var(--bg);margin:6px 0;border-radius:4px}.al.e{border-color:var(--r)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px;z-index:9}
#modal .box{background:var(--c);border-radius:12px;padding:16px;width:100%;max-width:560px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f label{display:flex;flex-direction:column;font-size:12px;color:var(--m);gap:3px}.f .full{grid-column:1/-1}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}h2{margin:4px 0 10px;font-size:17px}
.quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 12px;margin-bottom:12px}.quick-field{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--m)}.quick-field.full{grid-column:1/-1}.quick-field input,.quick-field select{width:100%}.quick-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.details-panel{border:1px solid var(--b);border-radius:8px;padding:8px 10px;background:var(--bg);margin-top:10px}.details-panel summary{cursor:pointer;color:var(--t);font-weight:600;list-style:none}.details-panel summary::-webkit-details-marker{display:none}.details-panel .quick-grid{margin-top:10px;margin-bottom:0}
</style></head><body><nav id="nav"></nav><main id="app"></main><div id="modal"></div>
<script>
const KEY='financehub_v2',TABS=['Painel','Lançamentos','Parceladas','Casa','Cartões','Projeção','Ajustes'];
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0'),fmt=(y,m,d)=>y+'-'+pad(m)+'-'+pad(d),pd=s=>s.split('-').map(Number);
const T=()=>{const d=new Date();return fmt(d.getFullYear(),d.getMonth()+1,d.getDate())};
function addM(s,n){const[y,m,d]=pd(s),t=y*12+m-1+n,yy=Math.floor(t/12),mm=t%12,dim=new Date(Date.UTC(yy,mm+1,0)).getUTCDate();return fmt(yy,mm+1,Math.min(d,dim))}
function addD(s,n){const[y,m,d]=pd(s),x=new Date(Date.UTC(y,m-1,d+n));return fmt(x.getUTCFullYear(),x.getUTCMonth()+1,x.getUTCDate())}
const R=c=>(c/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),D=s=>s?s.split('-').reverse().join('/'):'';
const MN=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const ML=k=>MN[+k.slice(5,7)-1]+'/'+k.slice(2,4);
const toC=s=>{s=String(s).trim();if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');return Math.round(parseFloat(s)*100)||0};
const esc=s=>String(s??'').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const mk=o=>Object.assign({id:uid(),kind:'out',desc:'',amt:0,date:T(),cat:'Outros',own:'Douglas',scope:'pessoal',pct:100,card:'',rec:'',end:'',done:{},skip:{},ov:{}},o);
const def=()=>({open:{date:T(),bal:0},items:[],cards:[],cats:['Salário','Renda extra','Reembolso','Fixa','Variável','Cartão','Empréstimo','Casa','Combustível','Alimentação','Assinatura','Contas','Educação','Lazer','Saúde','Transporte','Viagem','Outros'],lastBackup:'',trends:[]});
let S;try{S=JSON.parse(localStorage.getItem(KEY))||def()}catch(e){S=def()}
let tab=0,F={m:'',cat:'',own:'',st:'',q:''},CM=T().slice(0,7),PMonth=T().slice(0,7),HZ=12,PM=null;
function persistState(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){alert('Não foi possível salvar automaticamente: '+e.message+'. Exporte um backup.')}}
function save(){persistState();render()}
setInterval(()=>{persistState();},60000);
/* motor financeiro */
function occ(it,upto){const o=[];for(let k=0;;k++){let dt;
 if(it.rec==='mensal')dt=addM(it.date,k);else if(it.rec==='anual')dt=addM(it.date,12*k);else if(it.rec==='semanal')dt=addD(it.date,7*k);else if(it.rec==='quinzenal')dt=addD(it.date,14*k);else if(it.rec==='outro')dt=addD(it.date,k);else dt=it.date;
 if(!it.rec&&k>0)break;if(dt>upto||(it.end&&dt>it.end))break;if(it.skip[dt])continue;
 o.push({it,dt,amt:it.ov[dt]!=null?it.ov[dt]:it.amt,done:!!it.done[dt]})}return o}
const eff=o=>{const i=o.it;if(i.kind==='transfer')return 0;const a=i.scope==='casa'?Math.round(o.amt*i.pct/100):o.amt;return i.kind==='in'?a:-a};
const cmp=(a,b)=>a.dt<b.dt?-1:a.dt>b.dt?1:0;
const events=up=>S.items.flatMap(i=>occ(i,up)).filter(o=>o.dt>=S.open.date).sort(cmp);
const MS=()=>T().slice(0,7)+'-01';
function proj(n, base=MS()){const ms=base,ev=events(addD(addM(ms,n),-1));let bal=S.open.bal+ev.filter(o=>o.dt<ms).reduce((s,o)=>s+eff(o),0);const rows=[];
 for(let i=0;i<n;i++){const k=addM(ms,i).slice(0,7),m=ev.filter(o=>o.dt.slice(0,7)===k);
  const inn=m.reduce((s,o)=>s+Math.max(eff(o),0),0),out=m.reduce((s,o)=>s+Math.max(-eff(o),0),0);
  rows.push({k,ini:bal,inn,out,fim:bal+inn-out,ev:m});bal+=inn-out}return rows}
const atual=()=>S.open.bal+events(T()).filter(o=>o.done).reduce((s,o)=>s+eff(o),0);
const st=o=>o.done?(o.it.kind==='in'?'Recebido':'Pago'):o.dt<T()?'Atrasado':'Previsto';
const cl=v=>v<0?'neg':'pos';
/* views */
function go(i){tab=i;render()}
function render(){$('#nav').innerHTML=TABS.map((t,i)=>`<button class="${i==tab?'on':''}" onclick="go(${i})">${t}</button>`).join('');
 $('#app').innerHTML=[vPainel,vLanc,vParc,vCasa,vCart,vProj,vAj][tab]()}
function vPainel(){const rows=proj(13,PMonth+'-01'),c=rows[0],T0=T();let h='';
 const fx=c.ev.filter(o=>eff(o)<0&&o.it.rec).reduce((s,o)=>s-eff(o),0),pa=c.ev.filter(o=>eff(o)<0&&o.it.grp).reduce((s,o)=>s-eff(o),0),va=c.out-fx-pa;
 const fut=events(addM(PMonth+'-01',24)).filter(o=>o.it.grp&&o.dt>T0&&eff(o)<0).reduce((s,o)=>s-eff(o),0);
 const cart=c.ev.filter(o=>eff(o)<0&&(o.it.card||o.it.cat==='Cartão'||o.it.cat==='Empréstimo')).reduce((s,o)=>s-eff(o),0);
 const kp=(k,v,x='')=>`<div class="card" style="margin:0"><div class="k">${k}</div><div class="v ${x}">${v}</div></div>`;
 h+=`<div class="row"><input type="month" value="${PMonth}" onchange="PMonth=this.value;render()"></div>`;
 h+=`<div class="grid">${kp('Saldo atual (baixas)',R(atual()),cl(atual()))}${kp('Entradas do mês',R(c.inn))}${kp('Saídas do mês',R(c.out))}${kp('Saldo previsto fim do mês',R(c.fim),cl(c.fim))}${kp('Fixa + cartão',R(fx+cart))}${kp('Parcelas',R(pa))}${kp('Variável',R(va))}${kp('Futuras',R(fut))}</div>`;
 h+='<div class="card"><h2>Alertas</h2>'+alerts(rows)+'</div>';
 const mx=Math.max(1,...rows.slice(0,6).flatMap(r=>[r.inn,r.out]));
 h+='<div class="card"><h2>Entradas e saídas (6 meses)</h2>'+rows.slice(0,6).map(r=>`<div style="margin-bottom:8px"><div class="k">${ML(r.k)}: <span class="pos">${R(r.inn)}</span> / <span class="neg">${R(r.out)}</span> / <span class="${cl(r.fim)}">${R(r.fim)}</span></div><div class="bar" style="width:${Math.max(4,r.inn*100/mx)}%;margin-bottom:4px"></div><div class="bar o" style="width:${Math.max(4,r.out*100/mx)}%"></div></div>`).join('')+'</div>';
 const cats={};c.ev.filter(o=>eff(o)<0).forEach(o=>cats[o.it.cat]=(cats[o.it.cat]||0)-eff(o));const ce=Object.entries(cats).sort((a,b)=>b[1]-a[1]);
 h+='<div class="card"><h2>Gastos por categoria no mês</h2>'+(ce.length?ce.map(([k,v])=>`<div class="k">${esc(k)}: ${R(v)}</div><div class="bar o" style="width:${v*100/ce[0][1]}%;margin-bottom:6px"></div>`).join(''):'<span class="k">Sem dados.</span>')+'</div>';
 return h}
function alerts(rows){const a=[],T0=T(),ev=events(addD(T0,3));
 rows.forEach(r=>{if(r.fim<0)a.push(['e',`Saldo negativo previsto em ${ML(r.k)}: ${R(r.fim)}`]);else if(r.out>r.inn&&r.out)a.push(['',`${ML(r.k)}: despesas (${R(r.out)}) superam as receitas (${R(r.inn)})`]);
  const pa=r.ev.filter(o=>o.it.grp&&eff(o)<0).reduce((s,o)=>s-eff(o),0);if(r.out&&pa>r.out*.4)a.push(['',`${ML(r.k)}: parcelas concentram ${Math.round(pa*100/r.out)}% das saídas`]);
  if(r.inn&&r.out>r.inn*.8&&r.out<=r.inn)a.push(['',`${ML(r.k)}: ${Math.round(r.out*100/r.inn)}% da renda comprometida`])});
 const late=events(addD(T0,-1)).filter(o=>!o.done&&eff(o)!==0);if(late.length)a.push(['e',`${late.length} lançamento(s) atrasado(s) sem baixa, total ${R(late.reduce((s,o)=>s+eff(o),0))}`]);
 const soon=ev.filter(o=>!o.done&&o.dt>=T0&&eff(o)<0);if(soon.length)a.push(['',`${soon.length} conta(s) vencem em até 3 dias: ${R(-soon.reduce((s,o)=>s+eff(o),0))}`]);
 for(let i=1;i<rows.length;i++)if(rows[i-1].fim>0&&rows[i].fim<rows[i-1].fim*.5&&rows[i-1].fim-rows[i].fim>50000){a.push(['',`Redução relevante do saldo de ${ML(rows[i-1].k)} para ${ML(rows[i].k)}: ${R(rows[i-1].fim-rows[i].fim)}`])}
 return a.length?a.map(x=>`<div class="al ${x[0]}">${x[1]}</div>`).join(''):'<span class="k">Nenhum alerta.</span>'}
const opt=(l,v)=>l.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
function vLanc(){let ev=S.items.flatMap(i=>occ(i,addM(MS(),24))).filter(o=>(!F.m||o.dt.slice(0,7)===F.m)&&(!F.cat||o.it.cat===F.cat)&&(!F.own||o.it.own===F.own)&&(!F.st||st(o)===F.st)&&(!F.q||o.it.desc.toLowerCase().includes(F.q.toLowerCase())||o.it.cat.toLowerCase().includes(F.q.toLowerCase()))).sort(cmp);const n=ev.length;
 return `<h2>Lançamentos e entradas</h2><div class="row"><button class="p" onclick="openForm()">Novo lançamento</button><button onclick="openForm(null,null,'in')">Nova entrada</button>
 <input type="month" value="${F.m}" onchange="F.m=this.value;render()"><select onchange="F.cat=this.value;render()"><option value="">Categoria</option>${opt(S.cats,F.cat)}</select>
 <select onchange="F.own=this.value;render()"><option value="">Responsável</option>${opt(['Douglas','Bianca','Compartilhado','Outro'],F.own)}</select>
 <select onchange="F.st=this.value;render()"><option value="">Situação</option>${opt(['Previsto','Pago','Recebido','Atrasado'],F.st)}</select><input placeholder="Buscar" value="${esc(F.q)}" oninput="F.q=this.value;render()" style="min-width:150px"></div>
 <span class="k">${n} itens</span></div><div class="card w"><table><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Resp.</th><th>Meio</th><th class="n">Valor</th><th>Situação</th><th></th></tr>${ev.map(o=>`<tr class="${o.done?'':'bad'}"><td>${D(o.dt)}</td><td>${esc(o.it.desc)}</td><td>${esc(o.it.cat)}</td><td>${esc(o.it.own)}</td><td>${esc(o.it.card||o.it.scope)}</td><td class="n ${cl(eff(o))}">${R(eff(o))}</td><td>${st(o)}</td><td><button class="s" onclick="openForm('${o.it.id}','${o.dt}')">Editar</button></td></tr>`).join('')}</table></div>`}
function vProj(){const rows=proj(HZ);return `<h2>Projeção de saldo</h2><div class="row"><span class="k">Horizonte:</span><select onchange="HZ=+this.value;PM=null;render()">${[6,12,24,36].map(n=>`<option ${n===HZ?'selected':''}>${n}</option>`).join('')}</select></div>${rows.map(r=>`<div class="card"><div class="k">${ML(r.k)}</div><div class="v ${cl(r.fim)}">${R(r.fim)}</div></div>`).join('')}`}
function groups(){const g={};S.items.filter(i=>i.grp).forEach(i=>(g[i.grp]=g[i.grp]||[]).push(i));return Object.entries(g).map(([id,l])=>{const p=l.filter(i=>i.k>0).sort((a,b)=>a.date<b.date?-1:1)[0]||l[0];return {id,desc:p.desc,amt:l.reduce((s,i)=>s+i.amt,0),done:l.every(i=>i.done[i.date]),items:l};})}
function vParc(){return `<h2>Compras parceladas</h2><div class="row"><button class="p" onclick="openParc()">Nova compra parcelada</button></div><div class="card w"><table><tr><th>Compra</th><th>Parcelas</th><th>Valor total</th><th>Restante</th><th></th></tr>${groups().map(g=>`<tr><td>${esc(g.desc)}</td><td>${g.items.filter(i=>i.k>0).length}</td><td class="n">${R(g.amt)}</td><td class="n">${R(g.items.filter(i=>i.k>0&&!i.done[i.date]).reduce((s,i)=>s+i.amt,0))}</td><td><button class="s" onclick="gAlt('${g.id}')">Alterar</button></td></tr>`).join('')}</table></div>`}
function vCasa(){const ev=events(addD(addM(CM+'-01',1),-1)).filter(o=>o.it.scope==='casa'&&o.dt.slice(0,7)===CM);let a=0,d=0,b=0;ev.forEach(o=>{const e=eff(o);if(e<0)a-=e;else d+=e;b+=e});
 return `<h2>Despesas residenciais</h2><div class="row"><input type="month" value="${CM}" onchange="CM=this.value;render()"><button class="p" onclick="openForm(null,null,'out','casa')">Nova despesa</button></div><div class="grid"><div class="card"><div class="k">Gastos</div><div class="v neg">${R(a)}</div></div><div class="card"><div class="k">Receitas</div><div class="v pos">${R(d)}</div></div><div class="card"><div class="k">Saldo</div><div class="v ${cl(b)}">${R(b)}</div></div></div><div class="card w"><table><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Resp.</th><th class="n">Valor</th></tr>${ev.map(o=>`<tr><td>${D(o.dt)}</td><td>${esc(o.it.desc)}</td><td>${esc(o.it.cat)}</td><td>${esc(o.it.own)}</td><td class="n ${cl(eff(o))}">${R(eff(o))}</td></tr>`).join('')}</table></div>`}
function vCart(){const ev=events(addM(MS(),12));return `<h2>Cartões</h2><div class="row"><button class="p" onclick="openCard()">Novo cartão</button></div>${S.cards.map(c=>{const mine=ev.filter(o=>o.it.card===c.name||(o.it.card&&o.it.card===c.id));const total=mine.reduce((s,o)=>s+Math.max(-eff(o),0),0);return `<div class="card"><div class="row"><b>${esc(c.name)}</b><span class="k">Limite ${R(c.limit)}</span></div><div class="k">Gasto no período: ${R(total)}</div></div>`}).join('')||'<div class="card"><span class="k">Nenhum cartão cadastrado.</span></div>'}`}
function vAj(){return `<h2>Ajustes</h2><div class="card"><b>Saldo inicial</b><div class="row" style="margin-top:8px"><input type="date" id="od" value="${S.open.date}"><input id="ob" value="${(S.open.bal/100).toFixed(2)}"><button class="p" onclick="S.open={date:$('#od').value,bal:toC($('#ob').value)};save()">Salvar</button></div></div>
<div class="card"><b>Categorias</b> <span class="k">(separadas por vírgula)</span><div class="row" style="margin-top:8px"><input id="ct" style="flex:1" value="${esc(S.cats.join(', '))}"><button class="p" onclick="S.cats=$('#ct').value.split(',').map(x=>x.trim()).filter(Boolean);save()">Salvar</button></div></div>
<div class="card"><b>Dados</b><div class="row" style="margin-top:8px"><button onclick="expJ()">Exportar backup (JSON)</button><label class="s" style="border:1px solid var(--b);border-radius:6px;padding:4px 8px"><input type="file" accept="application/json" onchange="impJ(this.files[0])" style="display:none">Importar</label></div></div>`}
/* formulários */
function modal(h){$('#modal').innerHTML=`<div class="box">${h}</div>`;$('#modal').style.display='flex'}
function closeM(){$('#modal').style.display='none'}
const L=(id,l,inner,full)=>`<label class="${full?'full':''}">${l}${inner}</label>`,I=(id,v,t='text',x='')=>`<input id="${id}" type="${t}" value="${esc(v)}" ${x}>`,SE=(id,l,v)=>`<select id="${id}">${l.map(x=>`<option value="${esc(x)}" ${x===v?'selected':''}>${esc(x)}</option>`).join('')}</select>`;
function openForm(id,dt,kind,scope){const it=id?S.items.find(i=>i.id===id):mk({kind:kind||'out',scope:scope||'pessoal',pct:scope==='casa'?50:100,own:scope==='casa'?'Compartilhado':'Douglas',cat:scope==='casa'?'Casa':'Outros',date:dt||T()});
 const scopeOpts=['pessoal','casa'];
 const form=`<h2>${id?'Editar':'Novo'} lançamento</h2>
 <div class="quick-grid">
   <div class="quick-field"><label>Tipo</label><select id="fk"><option value="out" ${it.kind==='out'?'selected':''}>Despesa</option><option value="in" ${it.kind==='in'?'selected':''}>Receita</option></select></div>
   <div class="quick-field"><label>Escopo</label><select id="fs">${scopeOpts.map(s=>`<option value="${s}" ${it.scope===s||(!it.scope&&s===scope)?'selected':''}>${s==='casa'?'Casa':'Pessoal'}</option>`).join('')}</select></div>
   <div class="quick-field full"><label>Descrição</label><input id="fd" value="${esc(it.desc)}" placeholder="Ex.: Supermercado, aluguel..." /></div>
   <div class="quick-field"><label>Valor (R$)</label><input id="fa" value="${(it.amt/100).toFixed(2)}" placeholder="0,00" /></div>
   <div class="quick-field"><label>Data</label><input id="fdt" type="date" value="${it.date}" /></div>
   <div class="quick-field"><label>Categoria</label><select id="fc">${opt(S.cats,it.cat||'Outros')}</select></div>
   <div class="quick-field"><label>Responsável</label><select id="fo">${opt(['Douglas','Bianca','Compartilhado','Outro'],it.own||'Douglas')}</select></div>
   <div class="quick-field"><label>Cartão/conta</label><select id="fm"><option value="">Nenhum</option>${S.cards.map(c=>`<option value="${esc(c.name)}" ${it.card===c.name?'selected':''}>${esc(c.name)}</option>`).join('')}<option value="(conta)" ${it.card==='(conta)'?'selected':''}>(conta)</option></select></div>
 </div>
 <details class="details-panel">
   <summary>Mais opções</summary>
   <div class="quick-grid">
     <div class="quick-field"><label>Recorrência</label><select id="fr"><option value="">Único</option><option value="mensal" ${it.rec==='mensal'?'selected':''}>Mensal</option><option value="semanal" ${it.rec==='semanal'?'selected':''}>Semanal</option><option value="quinzenal" ${it.rec==='quinzenal'?'selected':''}>Quinzenal</option><option value="anual" ${it.rec==='anual'?'selected':''}>Anual</option></select></div>
     <div class="quick-field"><label>Finaliza em</label><input id="fe" type="date" value="${it.end||''}" /></div>
     <div class="quick-field"><label>Participação da casa (%)</label><input id="fp" type="number" min="0" max="100" value="${it.pct??100}" /></div>
     <div class="quick-field"><label>Marcar como pago?</label><label style="display:flex;align-items:center;gap:8px;padding:8px 0 0 0;"><input id="fx" type="checkbox" ${it.done&&it.done[it.date]?'checked':''}> Sim, já foi quitado</label></div>
   </div>
 </details>
 <div class="quick-actions"><button type="button" onclick="closeM()">Cancelar</button><button type="button" class="p" onclick="sv('${id||''}','${dt||''}')">Salvar</button></div>`;
 modal(form)
}
function sv(id,dt){const g=x=>$('#'+x).value,amt=toC(g('fa')),desc=g('fd').trim(),date=g('fdt');if(!desc||amt<=0||!date)return alert('Informe descrição, valor maior que zero e data.');
 let pct=Math.min(100,Math.max(0,+g('fp')||0));if(g('fs')==='pessoal')pct=100;
 const o={kind:g('fk'),desc,amt,date,cat:g('fc'),own:g('fo'),card:g('fm').startsWith('(')?'':g('fm'),scope:g('fs'),pct,rec:g('fr'),end:g('fe')},dn=$('#fx').checked;
 if(!id){const n=mk(o);if(dn)n.done[date]=true;S.items.push(n)}else{const it=S.items.find(i=>i.id===id);let c='3';
  if(it.rec){c=prompt('Lançamento recorrente. Aplicar a: 1 = só esta ocorrência, 2 = esta e as futuras, 3 = todas','2');if(!c)return}
  if(c==='1'){it.skip[dt]=true;const n=mk({...o,rec:'',end:''});if(dn)n.done[date]=true;S.items.push(n)}
  else if(c==='2'&&dt!==it.date){it.end=addD(dt,-1);const n=mk(o);['done','skip','ov'].forEach(k=>{Object.keys(it[k]).filter(x=>x>=dt).forEach(x=>{n[k][x]=it[k][x];delete it[k][x]})});if(dn)n.done[date]=true;S.items.push(n)}
  else{const od=it.done[dt];Object.assign(it,o);if(!it.rec){it.done={};if(dn)it.done[date]=true;it.ov={}}else if(dn!==!!od){it.done[dt]=dn}}}
 closeM();save()}
function openParc(){modal(`<h2>Nova compra parcelada</h2><div class="f">${L('','Descrição',I('pd',''),1)}${L('','Valor total (R$)',I('pt',''))}${L('','Entrada (R$)',I('pe','0,00'))}${L('','Nº parcelas',I('pn','1','number'))}${L('','Primeira data',I('p1',T(),'date'))}${L('','Categoria',SE('pc',S.cats,S.cats[0]||'Outros'))}${L('','Responsável',SE('po',['Douglas','Bianca','Compartilhado','Outro'],'Douglas'))}${L('','Cartão',SE('pm',['','(conta)'].concat(S.cards.map(c=>c.name)),''))}</div><div class="quick-actions"><button type="button" onclick="closeM()">Cancelar</button><button class="p" onclick="svParc()">Salvar</button></div>`)}
function svParc(){const g=x=>$('#'+x).value,desc=g('pd').trim(),n=Math.max(1,+g('pn')||1),ent=toC(g('pe')),tot=toC(g('pt'))+toC(g('pj')),d1=g('p1');if(!desc||tot<=0||!d1||ent>=tot&&n>0&&tot-ent<=0)return alert('Informe descrição, valor total, primeira data e número de parcelas.');
 const rest=tot-ent,pv=toC(g('pv')),base=Math.floor(rest/n),grp=uid(),b={cat:g('pc'),own:g('po'),card:g('pm').startsWith('(')?'':'',grp,n};
 if(ent>0)S.items.push(mk({...b,desc:desc+' (entrada)',amt:ent,date:d1,k:0}));
 for(let k=1;k<=n;k++){const a=pv>0?pv:(k===1?rest-base*(n-1):base);S.items.push(mk({...b,desc:`${desc} (parcela)`,amt:a,date:addM(d1,k-1),k}))}closeM();save()}
function openCard(){modal(`<h2>Novo cartão</h2><div class="f">${L('','Nome',I('cn',''),1)}${L('','Limite (R$)',I('cl',''))}${L('','Dia de fechamento',I('cf',1,'number','min=1 max=31'))}${L('','Dia de vencimento',I('cv',1,'number','min=1 max=31'))}</div><div class="quick-actions"><button type="button" onclick="closeM()">Cancelar</button><button class="p" onclick="svCard()">Salvar</button></div>`)}
function svCard(){const n=$('#cn').value.trim();if(!n)return alert('Informe o nome.');S.cards.push({id:uid(),name:n,limit:toC($('#cl').value),close:+$('#cf').value,due:+$('#cv').value});closeM();save()}
function delCard(id){if(confirm('Remover cartão? Os lançamentos continuam, mas perdem o vínculo visual.')){S.cards=S.cards.filter(c=>c.id!==id);save()}}
/* ações */
function tg(id,dt){const i=S.items.find(x=>x.id===id);i.done[dt]=!i.done[dt];if(!i.done[dt])delete i.done[dt];save()}
function du(id,dt){const i=S.items.find(x=>x.id===id);S.items.push(mk({...i,id:uid(),rec:'',end:'',date:dt,amt:i.ov[dt]??i.amt,grp:undefined,k:undefined,n:undefined,done:{},skip:{},ov:{}}));save()}
function rm(id,dt){const i=S.items.find(x=>x.id===id);let c='3';
 if(i.rec){c=prompt('Excluir: 1 = só esta ocorrência, 2 = esta e as futuras, 3 = todas','1');if(!c)return}else if(!confirm('Excluir este lançamento?'))return;
 if(c==='1'&&i.rec)i.skip[dt]=true;else if(c==='2'&&dt!==i.date)i.end=addD(dt,-1);else S.items=S.items.filter(x=>x.id!==id);save()}
const gi=id=>S.items.filter(i=>i.grp===id);
function gAlt(id){const v=prompt('Novo valor (R$) das parcelas futuras ainda não pagas:');if(v===null)return;const a=toC(v);if(a<=0)return;gi(id).filter(i=>i.k>0&&!i.done[i.date]&&i.date>=T()).forEach(i=>{i.amt=a;i.ov[i.date]=a});save()}
function gQuit(id){const l=gi(id).filter(i=>i.k>0&&!i.done[i.date]),s=l.reduce((a,i)=>a+i.amt,0);if(!l.length||!confirm(`Quitar saldo restante de ${R(s)} hoje?`))return;const b=l[0];S.items=S.items.filter(i=>!(i.grp===id&&i.k>0&&!i.done[i.date]));b.done[T()]=true;S.items.push(b);save()}
function gCanc(id){if(confirm('Cancelar as parcelas ainda não pagas? As já pagas permanecem no histórico.')){S.items=S.items.filter(i=>!(i.grp===id&&i.k>0&&!i.done[i.date]));save()}}
function gDel(id){if(confirm('Excluir a compra e todas as parcelas, inclusive as pagas?')){S.items=S.items.filter(i=>i.grp!==id);save()}}
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click()}
function expJ(){S.lastBackup=T();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}dl('financehub-backup-'+T()+'.json',JSON.stringify(S,null,1),'application/json');render()}
function impJ(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.items||!d.open)throw 0;if(confirm('Substituir os dados atuais pelo backup?')){S=d;save()}}catch(e){alert('Backup inválido.')}};r.readAsText(f)}
function expC(){const ev=S.items.flatMap(i=>occ(i,addM(MS(),24))).sort(cmp);const q=x=>`"${String(x).replace(/"/g,'""')}"`;dl('lancamentos-'+T()+'.csv','\ufeffData;Descrição;Tipo;Categoria;Resp.;Meio;Valor\n'+ev.map(o=>[D(o.dt),o.it.desc,o.it.kind==='in'?'Entrada':'Despesa',o.it.cat,o.it.own,o.it.card||o.it.scope,R(eff(o))].map(q).join(';')).join('\n'),'text/csv');}
render();
</script></body></html>
