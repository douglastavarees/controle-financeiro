<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Finance Hub</title>
  <style>
    :root {
      --bg:#f5f6f8; --c:#fff; --t:#1d2433; --m:#6b7385; --b:#e2e5ec; --p:#1f4fd8; --g:#12805c; --r:#c8352f; --y:#b7791f;
    }
    *{box-sizing:border-box}
    body{margin:0;font:14px system-ui,Arial,sans-serif;background:var(--bg);color:var(--t)}
    nav{display:flex;gap:6px;overflow:auto;padding:8px;background:var(--c);border-bottom:1px solid var(--b);position:sticky;top:0;z-index:10}
    nav button{white-space:nowrap}
    nav .on{background:var(--p);color:#fff;border-color:var(--p)}
    main{max-width:1100px;margin:0 auto;padding:16px}
    button,input,select{font:inherit;color:var(--t);background:var(--c);border:1px solid var(--b);border-radius:6px;padding:7px 10px}
    button{cursor:pointer}
    button.p{background:var(--p);color:#fff;border-color:var(--p)}
    .card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:12px;margin:12px 0}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
    .k{color:var(--m);font-size:12px}
    .v{font-size:20px;font-weight:700;margin-top:4px}
    .pos{color:var(--g)} .neg{color:var(--r)} .warn{color:var(--y)}
    table{width:100%;border-collapse:collapse} th,td{padding:8px 6px;border-bottom:1px solid var(--b);text-align:left}
    th{color:var(--m);font-size:12px}
    .n{text-align:right;white-space:nowrap}
    .bar{height:8px;border-radius:4px;background:var(--p);min-width:1px}
    .bar.o{background:var(--r)}
    .small{font-size:12px;color:var(--m)}
    input[type="date"], input[type="month"], select {min-height:38px}
    @media(max-width:620px){ .row{flex-direction:column;align-items:stretch} }
  </style>
</head>
<body>
  <nav id="nav"></nav>
  <main id="app"></main>

  <script>
    const KEY = 'financehub_v2';
    const TABS = ['Painel', 'Lançamentos', 'Casa', 'Cartões', 'Ajustes'];
    const $ = s => document.querySelector(s);
    const pad = n => String(n).padStart(2,'0');
    const fmt = (y,m,d) => `${y}-${pad(m)}-${pad(d)}`;
    const T = () => {
      const d = new Date();
      return fmt(d.getFullYear(), d.getMonth()+1, d.getDate());
    };
    const toC = s => {
      s = String(s ?? '').trim();
      if(!s) return 0;
      if(s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
      return Math.round(parseFloat(s) * 100) || 0;
    };
    const R = v => (v/100).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
    const esc = s => String(s ?? '').replace(/"/g,'&quot;').replace(/</g,'&lt;');

    const defState = () => ({
      open: { date: T(), bal: 0 },
      items: [],
      cards: [],
      cats: ['Salário', 'Renda extra', 'Reembolso', 'Fixa', 'Variável', 'Cartão', 'Empréstimo', 'Casa', 'Combustível', 'Alimentação', 'Assinatura', 'Outros'],
      lastBackup: ''
    });

    function parseState(raw) {
      if(!raw || typeof raw !== 'string') return null;
      try {
        const parsed = JSON.parse(raw);
        return parsed && typeof parsed === 'object' && Array.isArray(parsed.items) ? parsed : null;
      } catch (e) {
        return null;
      }
    }

    function readStateFromQuery() {
      try {
        const params = new URLSearchParams(window.location.search);
        const raw = params.get('state');
        if(!raw) return null;
        return parseState(decodeURIComponent(raw));
      } catch (e) {
        return null;
      }
    }

    function readStateFromHash() {
      try {
        const h = window.location.hash.replace(/^#/, '');
        if(!h) return null;
        const params = new URLSearchParams(h);
        const raw = params.get('state');
        if(!raw) return null;
        return parseState(decodeURIComponent(raw));
      } catch (e) {
        return null;
      }
    }

    function readStateFromStorage() {
      try {
        return parseState(localStorage.getItem(KEY));
      } catch (e) {
        return null;
      }
    }

    function loadState() {
      return readStateFromQuery() || readStateFromHash() || readStateFromStorage() || defState();
    }

    let S = loadState();
    let tab = 0;

    function updateShareLink() {
      try {
        const u = new URL(window.location.href);
        const state = encodeURIComponent(JSON.stringify(S));
        u.searchParams.set('state', state);
        u.hash = '';
        history.replaceState({}, '', u.toString());
      } catch (e) {}
    }

    function persistState() {
      try {
        localStorage.setItem(KEY, JSON.stringify(S));
      } catch (e) {}
      updateShareLink();
    }

    function save() {
      persistState();
      render();
    }

    function mkItem(o = {}) {
      return {
        id: Math.random().toString(36).slice(2,10),
        kind: 'out',
        desc: '',
        amt: 0,
        date: T(),
        cat: 'Outros',
        own: 'Douglas',
        scope: 'pessoal',
        pct: 100,
        card: '',
        rec: '',
        end: '',
        done: {},
        skip: {},
        ov: {},
        ...o
      };
    }

    function render() {
      $('#nav').innerHTML = TABS.map((t,i)=>`<button class="${i===tab?'on':''}" onclick="tab=${i};render()">${t}</button>`).join('');
      const views = [vPainel, vLanc, vCasa, vCart, vAj];
      $('#app').innerHTML = views[tab]();
    }

    function vPainel() {
      const items = S.items ?? [];
      const total = items.reduce((sum, i) => sum + (i.kind === 'in' ? i.amt : -i.amt), 0);
      return `
        <div class="card">
          <h2>Painel</h2>
          <div class="grid">
            <div class="card">
              <div class="k">Saldo atual</div>
              <div class="v ${total < 0 ? 'neg' : 'pos'}">${R(total)}</div>
            </div>
            <div class="card">
              <div class="k">Lanços</div>
              <div class="v">${items.length}</div>
            </div>
            <div class="card">
              <div class="k">Cartões</div>
              <div class="v">${(S.cards || []).length}</div>
            </div>
          </div>
        </div>
      `;
    }

    function vLanc() {
      const rows = (S.items || []).map(i => `
        <tr>
          <td>${i.date}</td>
          <td>${esc(i.desc)}</td>
          <td>${esc(i.cat)}</td>
          <td>${i.kind === 'in' ? 'Receita' : 'Despesa'}</td>
          <td class="n ${i.kind === 'in' ? 'pos' : 'neg'}">${R(i.kind === 'in' ? i.amt : -i.amt)}</td>
          <td><button class="small" onclick="removeItem('${i.id}')">Excluir</button></td>
        </tr>
      `).join('');

      return `
        <div class="card">
          <h2>Lançamentos</h2>
          <div class="row">
            <button class="p" onclick="addEntry()">Novo lançamento</button>
          </div>
          <div class="card">
            <table>
              <thead>
                <tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Tipo</th><th class="n">Valor</th><th>Ação</th></tr>
              </thead>
              <tbody>${rows || '<tr><td colspan="6">Nenhum lançamento.</td></tr>'}</tbody>
            </table>
          </div>
        </div>
      `;
    }

    function vCasa() {
      return `
        <div class="card">
          <h2>Casa</h2>
          <div class="small">A persistência entre navegadores agora usa o link compartilhável e também o armazenamento local do navegador.</div>
        </div>
      `;
    }

    function vCart() {
      const cards = (S.cards || []).map(c => `
        <div class="card">
          <div class="row">
            <strong>${esc(c.name)}</strong>
            <button class="small" onclick="deleteCard('${c.id}')">Excluir</button>
          </div>
          <div class="small">Limite: ${R(c.limit || 0)}</div>
        </div>
      `).join('');

      return `
        <div class="card">
          <h2>Cartões</h2>
          <div class="row">
            <button class="p" onclick="addCard()">Novo cartão</button>
          </div>
          ${cards || '<div class="card"><span class="small">Nenhum cartão cadastrado.</span></div>'}
        </div>
      `;
    }

    function vAj() {
      return `
        <div class="card">
          <h2>Ajustes</h2>
          <div class="row">
            <button class="p" onclick="copyShareLink()">Copiar link compartilhável</button>
            <button onclick="exportBackup()">Exportar backup</button>
          </div>
          <div class="card">
            <div class="small">Importante: um site estático como este não tem banco online. Para manter os dados em outro navegador, abra o link compartilhável gerado acima ou importe o arquivo de backup.</div>
          </div>
        </div>
      `;
    }

    function addEntry() {
      const desc = window.prompt('Descrição do lançamento:');
      if(desc === null || !desc.trim()) return;
      const amt = toC(window.prompt('Valor (R$):', '0,00') || '0');
      if(amt <= 0) return;
      const date = window.prompt('Data (YYYY-MM-DD):', T()) || T();
      const kind = window.confirm('É uma receita?') ? 'in' : 'out';
      S.items.push(mkItem({ desc: desc.trim(), amt, date, kind, cat: 'Outros' }));
      save();
    }

    function removeItem(id) {
      if(!confirm('Excluir este lançamento?')) return;
      S.items = (S.items || []).filter(i => i.id !== id);
      save();
    }

    function addCard() {
      const name = window.prompt('Nome do cartão:');
      if(!name || !name.trim()) return;
      const limit = toC(window.prompt('Limite do cartão (R$):', '0,00') || '0');
      S.cards = S.cards || [];
      S.cards.push({ id: Math.random().toString(36).slice(2,10), name: name.trim(), limit });
      save();
    }

    function deleteCard(id) {
      if(!confirm('Excluir este cartão?')) return;
      S.cards = (S.cards || []).filter(c => c.id !== id);
      save();
    }

    function exportBackup() {
      const blob = new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'financehub-backup.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    async function copyShareLink() {
      try {
        const u = new URL(window.location.href);
        const state = encodeURIComponent(JSON.stringify(S));
        u.searchParams.set('state', state);
        u.hash = '';
        await navigator.clipboard.writeText(u.toString());
        alert('Link compartilhável copiado! Abra esse link em outro navegador para carregar os dados.');
      } catch (e) {
        alert('Não foi possível copiar automaticamente. Use o botão de exportar backup e importe em outro navegador.');
      }
    }

    render();
    persistState();
  </script>
</body>
</html>
