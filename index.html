<div id="auth" style="display:none;position:fixed;inset:0;z-index:99;background:var(--bg);align-items:center;justify-content:center;padding:16px"><div class="card" style="width:100%;max-width:360px"><h2>Finance Hub</h2><div class="k" style="margin-bottom:10px">Entre para acessar seus dados em qualquer aparelho.</div><input id="ae" type="email" placeholder="E-mail" autocomplete="username" style="width:100%;margin-bottom:8px"><input id="ap" type="password" placeholder="Senha (mín. 6 caracteres)" autocomplete="current-password" style="width:100%;margin-bottom:10px" onkeydown="if(event.key==='Enter')doAuth('in')"><div class="row"><button class="p" onclick="doAuth('in')">Entrar</button><button onclick="doAuth('up')">Criar conta</button></div><div id="am" class="k neg" style="margin-top:8px"></div></div></div>

<script>
const KEY='financehub_v2',TABS=['Painel','Lançamentos','Parceladas','Casa','Cartões','Projeção','Saldo diário','Planejamento','Análise','Ajustes'];

const pad=n=>String(n).padStart(2,'0'),fmt=(y,m,d)=>y+'-'+pad(m)+'-'+pad(d),pd=s=>s.split('-').map(Number);

const def=()=>({open:{date:T(),bal:0},items:[],cards:[],cats:['Salário','Renda extra','Reembolso','Fixa','Variável','Cartão','Empréstimo','Casa','Combustível','Alimentação','Assinatura','Outros'],lastBackup:''});

function parseState(raw){
  if(!raw || typeof raw !== 'string') return null;
  try {
    const parsed = JSON.parse(raw);
    return parsed && typeof parsed === 'object' && Array.isArray(parsed.items) ? parsed : null;
  } catch (e) { return null; }
}

function readStateFromHash(){
  try {
    const h = window.location.hash.replace(/^#/, '');
    if (!h) return null;
    const q = new URLSearchParams(h);
    const raw = q.get('state');
    if (!raw) return null;
    return parseState(decodeURIComponent(raw));
  } catch (e) { return null; }
}

function readStateFromStorage(){
  try {
    return parseState(localStorage.getItem(KEY));
  } catch (e) {
    return null;
  }
}

function loadState(){
  const fromHash = readStateFromHash();
  if (fromHash) return fromHash;
  const fromStorage = readStateFromStorage();
  if (fromStorage) return fromStorage;
  return def();
}

let S=(readStateFromStorage()||readStateFromHash()||def());
if(location.hash)history.replaceState({},'',location.pathname);
let tab=0,F={m:'',cat:'',own:'',st:'',q:''},CM=T().slice(0,7),PMonth=T().slice(0,7),PM=null;

  } catch (e) {}
}

function persistState0(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* safari/private mode can block localStorage; keep state in URL as fallback */ }

}

/* motor financeiro */
function occ0(it,upto){const o=[];for(let k=0;;k++){let dt;
  if(it.rec==='mensal')dt=addM(it.date,k);else if(it.rec==='anual')dt=addM(it.date,12*k);else if(it.rec==='semanal')dt=addD(it.date,7*k);else if(it.rec==='quinzenal')dt=addD(it.date,14*k);else if(it.rec==='bi')dt=addD(it.date,15*k);else if(it.rec==='trimestral')dt=addM(it.date,3*k);else if(it.rec==='semestral')dt=addM(it.date,6*k);else if(it.rec==='diario')dt=addD(it.date,k);else dt=it.date;

  o.push({it,dt,amt:it.ov[dt]!=null?it.ov[dt]:it.amt,done:!!it.done[dt]})}return o}
const eff=o=>{const i=o.it;if(i.kind==='transfer')return 0;const a=i.scope==='casa'?Math.round(o.amt*i.pct/100):o.amt;return i.kind==='in'?a:-a};

const mir=o=>isDg(o.it)?[{...o,it:{...o.it,id:o.it.id+'~r',kind:'in',scope:'pessoal',own:'Douglas',pct:100,cred:o.it.scope==='casa'?'Casa':'Bianca',card:'',grp:undefined,rec:'',mirror:true,desc:o.it.desc.replace(/ \((parcela|entrada|quitação)\)$/,'')+' (repasse)'},done:!!(o.it.rdone&&o.it.rdone[o.dt])}]:[];
const events=up=>S.items.flatMap(i=>occ(i,up)).flatMap(o=>[o,...mir(o)]).filter(o=>o.dt>=S.open.date).sort(cmp);
const MS=()=>T().slice(0,7)+'-01';
function proj(n, base=MS()){const ms=base,ev=events(addD(addM(ms,n),-1));let bal=S.open.bal+ev.filter(o=>o.dt<ms).reduce((s,o)=>s+eff(o),0);const rows=[];
  for(let i=0;i<n;i++){const k=addM(ms,i).slice(0,7),m=ev.filter(o=>o.dt.slice(0,7)===k);
   const inn=m.reduce((s,o)=>s+Math.max(eff(o),0),0),out=m.reduce((s,o)=>s+Math.max(-eff(o),0),0);
   rows.push({k,ini:bal,inn,out,fim:bal+inn-out,ev:m});bal+=inn-out}return rows}
const atual=()=>S.open.bal+events(T()).filter(o=>o.done).reduce((s,o)=>s+eff(o),0);
const st=o=>o.done?(o.it.kind==='in'?'Recebido':'Pago'):o.dt<T()?'Atrasado':'Previsto';
const cl=v=>v<0?'neg':'pos';
/* views */

  $('#app').innerHTML=(tab<4&&tab!=2?QA():'')+[vPainel,vLanc,vParc,vCasa,vCart,()=>'',vDia,vPlano,()=>'',vAj][tab]()}
function vPainel0(){const rows=proj(13,PMonth+'-01'),c=rows[0],T0=T();let h='';
  const fx=c.ev.filter(o=>eff(o)<0&&o.it.rec).reduce((s,o)=>s-eff(o),0),pa=c.ev.filter(o=>eff(o)<0&&o.it.grp).reduce((s,o)=>s-eff(o),0),va=c.out-fx-pa;
  const fut=events(addM(PMonth+'-01',24)).filter(o=>o.it.grp&&o.dt>T0&&eff(o)<0).reduce((s,o)=>s-eff(o),0);

  return h}
const opt=(l,v)=>l.map(x=>`<option ${x===v?'selected':''}>${esc(x)}</option>`).join('');
function vLanc(){const all=S.items.flatMap(i=>occ(i,addM(MS(),24))).flatMap(o=>[o,...mir(o)]),pass=(o,x)=>(x==='m'||!F.m||o.dt.slice(0,7)===F.m)&&(x==='cat'||mm('cat',v=>o.it.cat===v))&&(x==='own'||mm('own',v=>o.it.own===v))&&(x==='k'||mm('k',v=>o.it.kind===v))&&(x==='cd'||mm('cd',v=>v==='_'?!o.it.card:o.it.card===v))&&(x==='st'||mm('st',v=>st(o)===v))&&(x==='cr'||mm('cr',v=>v==='_'?!o.it.cred:nk(o.it.cred)===v))&&(!F.q||qm(o)),mm=(k,f)=>{const a=fa(k);return !a.length||a.some(f)},uv=(x,f)=>{const c=new Set();all.filter(o=>pass(o,x)).forEach(o=>c.add(f(o)));fa(x).forEach(v=>c.add(v));return [...c].sort().map(v=>[v,v])};let ev=all.filter(o=>pass(o)).sort(cmp);LV=ev;return `<h2>Lançamentos</h2><div class="row"><button onclick="expCSV()">Exportar CSV</button><button onclick="window.print()">PDF / imprimir</button></div><div class="row">${L('','Mês',`<input type="month" value="${F.m}" onchange="F.m=this.value;render()">`,1)}${L('','Tipo',msBtn('k','Tipo',[['in','Receita'],['out','Despesa']]),1)}${L('','Cartão',msBtn('cd','Cartão',[...S.cards.map(c=>[c.name,c.name]),['_','Sem cartão']]),1)}${L('','Pagar a / receber de',msBtn('cr','Pagar a / receber de',[...[...new Set([...S.items.map(i=>nk(i.cred)),...S.items.filter(isDg).map(i=>i.scope==='casa'?'CASA':'BIANCA')].filter(Boolean))].sort().map(v=>[v,v]),['_','Sem credor']]),1)}${L('','Categoria',msBtn('cat','Categoria',uv('cat',o=>o.it.cat)),1)}${L('','Responsável',msBtn('own','Responsável',uv('own',o=>o.it.own)),1)}${L('','Status',msBtn('st','Status',uv('st',o=>st(o))),1)}${L('','Busca',`<input value="${esc(F.q)}" placeholder="Buscar em tudo: nome, valor, data, cartão..." oninput="F.q=this.value;renderKeep(this)">`,1)}</div><div class="k" style="margin:8px 0">${ev.length} lançamento(s) | Despesas (valor cheio): <b>${R(ev.filter(o=>o.it.kind==='out').reduce((a,o)=>a+o.amt,0))}</b> | Receitas: <b>${R(ev.filter(o=>o.it.kind==='in').reduce((a,o)=>a+o.amt,0))}</b></div><div class="card w"><table><tr><th>Data</th><th>Descrição</th><th>Categoria</th><th>Tipo</th><th class="n">Valor</th><th>Status</th><th>Ações</th></tr>${ev.map(o=>`<tr id="r_${o.it.id}_${o.dt}" class="${!o.done&&o.dt<T()&&eff(o)?'bad':''}"><td>${D(o.dt)}</td><td>${esc(o.it.desc)}${o.it.cred||o.it.card?`<br><span class="k">${o.it.cred?(o.it.kind==='in'?'receber de ':'pagar a ')+esc(o.it.cred):esc(o.it.card)}</span>`:''}</td><td>${esc(o.it.cat)}</td><td>${o.it.kind==='in'?'Receita':'Despesa'}</td><td class="n ${cl(eff(o))}">${R(eff(o))}</td><td>${st(o)}</td><td><button class="s" onclick="tg('${o.it.id}','${o.dt}')">${o.done?'desmarcar':(o.it.kind==='in'?'receber':'pagar')}</button> ${o.it.mirror?'<span class="k">automática (vem da despesa da casa)</span>':`${o.it.rec?`<button class="s" onclick="du('${o.it.id}','${o.dt}')">duplicar</button>`:''} <button class="s" onclick="openForm('${o.it.id}','${o.dt}','${o.it.kind}','${o.it.scope}')">editar</button> <button class="s" onclick="rm('${o.it.id}','${o.dt}')">excluir</button>`}</td></tr>`).join('')||'<tr><td colspan="7">Nenhum lançamento.</td></tr>'}</table></div>`}
function groups(){const g={};S.items.filter(i=>i.grp).forEach(i=>(g[i.grp]=g[i.grp]||[]).push(i));return Object.entries(g).map(([id,l])=>{const p=l.filter(i=>i.k>0).sort((a,b)=>a.date<b.date?-1:1);return {id,items:l,total:p.reduce((s,i)=>s+i.amt,0),count:p.length,done:p.filter(i=>i.done[cdate(i,i.date)]).length}})}
function vParc(){return `<h2>Compras parceladas</h2><div class="row"><button class="p" onclick="openParc()">Nova compra parcelada</button></div><div class="card w"><table><tr><th>Compra</th><th>Parcelas</th><th>Valor</th><th>Pago</th><th>Ações</th></tr>${groups().map(g=>`<tr><td>${esc(g.items[0].desc.replace(/ \(parcela\)| \(entrada\)/g,''))}${g.items[0].cred||g.items[0].card?`<br><span class="k">${g.items[0].cred?(g.items[0].kind==='in'?'receber de ':'pagar a ')+esc(g.items[0].cred):esc(g.items[0].card)}</span>`:''}</td><td>${g.count}/${g.items[0].n||g.count}</td><td>${R(g.total)}</td><td>${g.done}/${g.count}</td><td><button class="s" onclick="gAlt('${g.id}')">ajustar</button> <button class="s" onclick="gQuit('${g.id}')">quitar</button> <button class="s" onclick="gCanc('${g.id}')">cancelar</button> <button class="s" onclick="gDel('${g.id}')">excluir</button></td></tr>`).join('')||'<tr><td colspan="5">Nenhuma compra parcelada.</td></tr>'}</table></div>`}
/* formulários */

 <div class="card w" style="padding:8px"><table style="border-collapse:separate;border-spacing:2px;font-size:12px;table-layout:fixed;width:${n*112}px"><colgroup>${cols.map(()=>'<col style="width:26px"><col style="width:82px">').join('')}</colgroup><tr>${cols.map(c=>`<th colspan="2" style="text-align:center;white-space:nowrap">${ML(c.m.slice(0,7))}</th>`).join('')}</tr>${Array.from({length:31},(_,i)=>`<tr>${cols.map(c=>{const x=c.days[i];if(!x)return '<td></td><td></td>';const[ds,v]=x;return `<td style="color:var(--m);text-align:center;padding:4px 2px">${i+1}</td><td onclick="dayInfo('${ds}')" style="background:${bgv(v)};text-align:right;padding:4px 6px;border-radius:5px;cursor:pointer;white-space:nowrap;${ds===T()?'outline:2px solid var(--p)':''}">${fr(v)}</td>`}).join('')}</tr>`).join('')}</table></div>`}
function dayInfo(ds){const ev=events(ds),b=S.open.bal+ev.reduce((s,o)=>s+eff(o),0),l=ev.filter(o=>o.dt===ds);modal(`<h2>${D(ds)}</h2><div class="k" style="margin-bottom:8px">Saldo no fim do dia: <b class="${cl(b)}">${R(b)}</b></div>${l.map(o=>`<div onclick="closeM();goRow('${o.it.id}','${o.dt}')" style="display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--b);cursor:pointer"><span>${esc(o.it.desc)}<br><span class="k">${st(o)}</span></span><b class="${cl(eff(o))}">${R(eff(o))}</b></div>`).join('')||'<div class="k">Sem lançamentos neste dia.</div>'}<div class="quick-actions"><button type="button" onclick="closeM()">Fechar</button></div>`)}

let PLM=T().slice(0,7);
function vPlano(){const m=PLM,pl=S.plan||{},invp=pl.inv!=null?pl.inv:20,ev=events(addD(addM(m+'-01',1),-1)).filter(o=>o.dt.slice(0,7)===m&&!o.it.mirror),sm=l=>l.reduce((s,o)=>s+o.amt,0),out=ev.filter(o=>o.it.kind==='out'),isI=o=>/invest|reserva|poupan/i.test(o.it.cat);
 const auto=sm(ev.filter(o=>o.it.kind==='in'&&/sal[aá]rio/i.test(o.it.cat)&&!/13/.test(o.it.desc))),sal=pl.sal||auto,
 casa=Math.round(out.filter(o=>o.it.scope==='casa'&&!isI(o)).reduce((s,o)=>s+o.amt*o.it.pct/100,0)),
 rest=out.filter(o=>o.it.scope!=='casa'&&!isI(o)&&o.it.own==='Douglas'),
 parc=sm(rest.filter(o=>o.it.grp)),fix=sm(rest.filter(o=>!o.it.grp&&o.it.rec)),avs=sm(rest.filter(o=>!o.it.grp&&!o.it.rec)),oth=parc+fix+avs,
 meta=Math.round(sal*invp/100),invd=sm(out.filter(isI)),inv=Math.max(meta,invd),livre=sal-casa-oth-inv,
 pc=v=>(sal?v*100/sal:0).toFixed(1).replace('.',',')+'%',
 [y,mo]=pd(m+'-01'),dim=new Date(Date.UTC(y,mo,0)).getUTCDate(),cur=m===T().slice(0,7),left=cur?dim-Number(T().slice(8))+1:dim,
 segs=[['Casa',casa,'var(--p)'],['Outras despesas',oth,'var(--y)'],['Investimento',inv,'var(--g)'],['Livre',Math.max(0,livre),'var(--b)']],tot=Math.max(1,segs.reduce((a,x)=>a+x[1],0)),
 line=(l,v,c,sub)=>`<div style="display:flex;justify-content:space-between;gap:8px;padding:${sub?'2px 0 2px 16px':'9px 0'};${sub?'':'border-bottom:1px solid var(--b)'}"><span class="${sub?'k':''}">${c?`<span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${c};margin-right:6px"></span>`:''}${l}</span><span class="${sub?'k':''}"><b>${R(v)}</b> <span class="k">${pc(v)}</span></span></div>`;
 return `<h2>Planejamento do salário</h2>
 <div class="card"><div class="k">Mês</div><input type="month" value="${m}" onchange="PLM=this.value;render()" style="width:100%;margin-bottom:10px">
 <div class="k">Salário base (100%)${pl.sal?'':' - detectado pelas receitas da categoria Salário'}</div><input inputmode="numeric" value="${(sal/100).toFixed(2).replace('.',',')}" oninput="mask(this)" onchange="S.plan={...(S.plan||{}),sal:toC(this.value)};save()" style="width:100%;margin-bottom:6px">${pl.sal?`<button class="s" onclick="S.plan={...(S.plan||{}),sal:0};save()">usar o valor detectado (${R(auto)})</button>`:''}
 <div class="k" style="margin-top:10px">Meta de investimento (% do salário)</div><input type="number" min="0" max="100" value="${invp}" onchange="S.plan={...(S.plan||{}),inv:+this.value||0};save()" style="width:100%"></div>
 ${sal?`<div class="card"><h2>Para onde vai o salário</h2><div style="display:flex;height:24px;border-radius:12px;overflow:hidden;margin:8px 0 12px;background:var(--b)">${segs.filter(x=>x[1]>0).map(x=>`<div style="width:${x[1]*100/tot}%;background:${x[2]}"></div>`).join('')}</div>
 ${line('Salário base',sal,'',0)}${line('Casa (minha parte)',casa,'var(--p)',0)}${line('Outras despesas',oth,'var(--y)',0)}${line('Parcelas',parc,'',1)}${line('Fixas e recorrentes',fix,'',1)}${line('Avulsas',avs,'',1)}${line('Investimento (meta '+String(invp).replace('.',',')+'%)',inv,'var(--g)',0)}${invd?line('já lançado como investimento',invd,'',1):''}
 <div style="padding:10px 0"><b class="${livre<0?'neg':'pos'}">${livre>=0?'Sobra para gastos variáveis':'Passou do planejado'}: ${R(Math.abs(livre))} (${pc(Math.abs(livre))})</b>${livre>0&&left>0?`<div class="k">Dá cerca de ${R(Math.floor(livre/left))} por dia ${cur?'nos '+left+' dias que faltam':'no mês'}.</div>`:''}${livre<0?'<div class="k">Para guardar a meta, as despesas precisam cair esse valor.</div>':''}</div></div>
 <div class="k">Casa é só a sua parte. Só entram despesas com responsável Douglas; despesas da Bianca ou de outras pessoas não entram. Lançamentos com categoria Investimento, Reserva ou Poupança contam como investido.</div>`:'<div class="card"><span class="k">Não encontrei salário neste mês. Informe o salário base acima.</span></div>'}`}

function vCart(){const ev=events(addM(MS(),12)).filter(o=>o.it.kind==='out'),T0=T(),sum=l=>l.reduce((s,o)=>s+o.amt,0),pk=o=>o.it.scope==='casa'?'c':o.it.own==='Bianca'?'b':o.it.own==='Douglas'?'d':'o',tl=l=>{const t={c:0,b:0,d:0,o:0};l.forEach(o=>{t[pk(o)]+=o.amt});return t},
 tile=(n,v,x='')=>`<div style="flex:1;min-width:0;background:var(--bg);border-radius:10px;padding:8px 4px;text-align:center"><div class="k">${n}</div><div class="${x}" style="font-weight:700;font-size:15px;word-break:break-word">${R(v)}</div></div>`,
 tiles=t=>`<div style="display:flex;gap:6px;margin-top:8px">${tile('Casa',t.c)}${tile('Bianca',t.b)}${tile('Douglas',t.d)}</div>${t.o?`<div class="k" style="margin-top:4px">Outros (compartilhado): ${R(t.o)}</div>`:''}`,
 bar=(p,c)=>`<div style="height:8px;border-radius:4px;background:var(--b);overflow:hidden;margin-top:8px"><div style="width:${Math.min(100,Math.max(0,p))}%;height:100%;background:${c}"></div></div>`;
 return `<h2>Cartões</h2><div class="row"><button class="p" onclick="openCard()">Novo cartão</button></div>${S.cards.map((c,i)=>{
 const m=ev.filter(o=>o.it.card===c.name),un=m.filter(o=>!o.done),cd=un.filter(o=>o.dt>=T0).reduce((a,o)=>o.dt<a?o.dt:a,'9999'),inCur=o=>cd==='9999'?o.dt<T0:o.dt<=cd,cnt=o=>!o.done&&!o.it.nolim&&(o.it.grp||!o.it.rec||inCur(o)),used=sum(m.filter(cnt)),cur=sum(un.filter(o=>inCur(o)&&!o.it.nolim)),fpar=used-sum(un.filter(o=>cnt(o)&&inCur(o))),sub=sum(un.filter(o=>!o.it.nolim))-used,av=c.limit-used,pc=used*100/Math.max(1,c.limit),fs={};
 m.forEach(o=>{(fs[o.dt]=fs[o.dt]||[]).push(o)});
 return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><strong style="font-size:18px">${esc(c.name)}</strong><span><button class="s" onclick="openCard('${c.id}')">editar</button> <button class="s" onclick="delCard('${c.id}')">remover</button></span></div>
 <div class="k" style="margin-top:2px">Fecha dia ${c.close} | vence dia ${c.due}</div>
 <div style="display:flex;gap:6px;margin-top:10px">${tile('Limite',c.limit)}${tile('Comprometido',used)}${tile('Disponível',av,cl(av))}</div>${bar(pc,pc>90?'var(--r)':pc>70?'var(--y)':'var(--g)')}
 <div class="k" style="margin-top:4px">${Math.round(pc)}% do limite comprometido: fatura atual e vencidas ${R(cur)} + parcelas e compras das próximas faturas ${R(fpar)}. Assinaturas e recorrências futuras (${R(sub)}) não consomem limite até serem cobradas.</div>
 ${Object.keys(fs).sort().map(d=>{const l=fs[d],t=sum(l),ok=l.every(o=>o.done),pg=sum(l.filter(o=>o.done)),lib=sum(l.filter(cnt)),st=ok?'Paga':pg>0?(d===cd?'Fatura atual, parcialmente paga':'Parcialmente paga'):d===cd?'Fatura atual':d<T0?'Atrasada':'Futura';
 return `<div style="border:1px solid var(--b);border-radius:12px;padding:10px;margin-top:10px;${ok?'opacity:.65':''}"><div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px"><b>Vence ${D(d)}</b><span style="font-size:20px;font-weight:700">${R(ok?t:t-pg)}</span></div><div class="k" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span>${st} | ${Math.round(t*100/Math.max(1,c.limit))}% do limite${pg>0&&!ok?` | total ${R(t)}, já pago ${R(pg)}`:''}</span>${ok?'':`<span><button class="s" onclick="advF(${i},'${d}')">adiantar</button> <button class="s" onclick="payF(${i},'${d}')">pagar fatura</button></span>`}</div>${tiles(tl(ok?l:l.filter(o=>!o.done)))}${l.filter(o=>o.it.advk==='neg').map(o=>`<div class="k" style="margin-top:6px;display:flex;justify-content:space-between;align-items:center;gap:8px"><span>Adiantado: ${R(-o.amt)}</span>${ok?'':`<button class="s" onclick="undoAdv('${o.it.adv}')">desfazer</button>`}</div>`).join('')}${ok?'':`<div class="k" style="margin-top:6px">Ao pagar, libera ${R(lib)} do limite</div>`}</div>`}).join('')||'<div class="k" style="margin-top:10px">Sem lançamentos neste cartão.</div>'}</div>`}).join('')||'<div class="card"><span class="k">Nenhum cartão cadastrado.</span></div>'}`}
/* adiantamento de fatura */
function advRem(c,d){return events(addM(MS(),12)).filter(o=>o.it.kind==='out'&&o.it.card===c.name&&o.dt===d&&!o.done).reduce((s,o)=>s+o.amt,0)}
function advF(i,d){const c=S.cards[i],rem=advRem(c,d);if(rem<=0)return alert('Esta fatura não tem saldo em aberto.');
 modal(`<h2>Adiantar fatura</h2><div class="k" style="margin-bottom:10px">${esc(c.name)} | vence ${D(d)} | em aberto ${R(rem)}</div><div class="f"><div class="quick-field"><label>Valor a adiantar (R$)</label><input id="av" inputmode="numeric" oninput="mask(this)" placeholder="0,00"></div><div class="quick-field"><label>Data do pagamento</label><input id="ad" type="date" value="${T()}"></div></div><div class="k" style="margin-top:8px">O valor sai do seu saldo na data do pagamento e é abatido da fatura que vence em ${D(d)}, liberando limite no cartão.</div><div class="quick-actions"><button type="button" onclick="closeM()">Cancelar</button><button type="button" class="p" onclick="svAdv(${i},'${d}')">Adiantar</button></div>`)}
function svAdv(i,d){const c=S.cards[i],rem=advRem(c,d),a=toC($('#av').value),dt=$('#ad').value;
 if(!(a>0))return alert('Informe o valor.');if(!dt)return alert('Informe a data do pagamento.');if(a>rem)return alert('O valor passa do que está em aberto na fatura ('+R(rem)+').');
 const id=uid(),nm=c.name+' (venc. '+D(d)+')';
 S.items.push(mk({desc:'Adiantamento de fatura '+nm,amt:a,date:dt,cat:'Cartão',own:'Douglas',adv:id,advk:'pay',done:dt<=T()?{[dt]:true}:{}}));
 S.items.push(mk({desc:'Abatimento da fatura '+nm,amt:-a,date:d,cat:'Cartão',own:'Douglas',card:c.name,adv:id,advk:'neg'}));
 closeM();save()}
function undoAdv(id){if(confirm('Desfazer este adiantamento?')){S.items=S.items.filter(x=>x.adv!==id);save()}}

/* filtros com seleção múltipla */
const fa=k=>Array.isArray(F[k])?F[k]:[];
let MSO={};
function msBtn(key,title,opts){MSO[key]={t:title,o:opts};const a=fa(key),lab=!a.length?'Todos':a.length===1?(opts.find(x=>x[0]===a[0])||[a[0],a[0]])[1]:a.length+' selecionados';
 return `<button type="button" onclick="openMS('${key}')" style="width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(lab)}</span><span>▾</span></button>`}
function openMS(key){const m=MSO[key];if(!m)return;const sel=fa(key);
 modal(`<h2>${esc(m.t)}</h2><div style="max-height:55vh;overflow:auto">${m.o.map(([v,l])=>`<label style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--b);cursor:pointer"><input type="checkbox" class="msc" value="${esc(v)}" ${sel.includes(v)?'checked':''} style="width:22px;height:22px;padding:0;flex:none"><span>${esc(l)}</span></label>`).join('')||'<div class="k">Nenhuma opção.</div>'}</div><div class="quick-actions"><button type="button" onclick="F['${key}']=[];closeM();render()">Limpar</button><button type="button" class="p" onclick="applyMS('${key}')">Aplicar</button></div>`)}
function applyMS(key){F[key]=[...document.querySelectorAll('#modal .msc:checked')].map(x=>x.value);closeM();render()}

render();
</script></body></html>
